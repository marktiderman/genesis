packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 refuses to run a dependency's build script unless it is named
# here, and it makes that refusal an ERROR (`ERR_PNPM_IGNORED_BUILDS`).
# pnpm 9 ran every one of these silently, so this list RECORDS the behaviour
# the repository already had. It grants nothing new.
#
# The key is `allowBuilds`, a MAP, not the pnpm 10 `onlyBuiltDependencies`
# LIST. pnpm 11 removed that setting and replaced it with this one
# (https://pnpm.io/settings/build). A leftover `onlyBuiltDependencies` block
# is not an error and not a warning: pnpm ignores it in silence, and the
# install still fails on `ERR_PNPM_IGNORED_BUILDS`. Measured on CI run
# 34433045280, where the list form was present and every package in it was
# still reported as ignored.
#
# The names are exactly what pnpm 11.26.0 reported on this workspace.
allowBuilds:
  "@bundled-es-modules/glob": true
  # From @tailwindcss/cli (the studio's prebuilt stylesheet). Its install
  # script only builds a native file watcher for --watch, which the build
  # never uses; prebuilt binaries cover the platforms we run on.
  "@parcel/watcher": false
  # From @sentry/react-native (the starter). Its install script downloads the
  # sentry-cli binary, which only uploads source maps. Source map upload is
  # optional and off in the starter; an app that turns the Sentry Expo plugin
  # on sets this to true so EAS builds can upload.
  "@sentry/cli": false
  esbuild: true
  style-dictionary: true
  unrs-resolver: true

# pnpm 11 reads ONLY auth and registry settings from `.npmrc`. Every other
# setting must live here (https://pnpm.io/settings). The three below were in
# `.npmrc` and pnpm 11 ignored all three in silence — no error, no warning.
#
# MEASURED consequence on CI run 34433391298, the first run to get past the
# install step: with `nodeLinker` unapplied, pnpm used its default isolated
# layout, `@types/node` left the workspace root, and `packages/core` failed
# to build with `TS2580: Cannot find name 'process'`. `packages/core` never
# declared `@types/node`; it relied on the hoisted layout, and it compiled
# under pnpm 9 for that reason.
#
# `autoInstallPeers` also shapes the lockfile. pnpm 9 resolved this
# workspace with it ON, so turning it off here would put `--frozen-lockfile`
# in conflict with the committed `pnpm-lock.yaml`.
#
# Hoisted layout is required for the Metro bundler in the Expo apps.
nodeLinker: hoisted
autoInstallPeers: true
# React Native packages declare conflicting peers.
strictPeerDependencies: false

# One React and one React Native for the whole workspace: the versions Expo SDK 58 pins (React
# Native 0.88, react 19.3.0). With the hoisted layout, a second version puts packages built for
# one React next to the other: react-dom refuses to load beside a react of another patch
# ("Incompatible React versions"), and a dependency's nested @types/react breaks the web
# package's declaration build. Move these with the Expo SDK.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  react-native: 0.88.0

patchedDependencies:
  # tsup 8.5.1's declaration build forces `baseUrl: "."` into the compiler options, and TypeScript 6
  # fails on `baseUrl` (TS5101, deprecated). The patch deletes that one line, as tsup 9.0.0 does
  # upstream; no package sets `paths`, and the emitted .d.ts files are byte-identical with and
  # without it (measured on every package's dist). Drop the patch when the packages move to tsup 9.
  # It names 8.5.1 exactly: if the lockfile moves tsup to another 8.x, re-create it for that version.
  # `genesis init` leaves this block out of an app's pnpm settings (an app has no patches/ folder).
  tsup@8.5.1: patches/tsup@8.5.1.patch
