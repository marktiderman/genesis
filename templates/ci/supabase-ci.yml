# Copy to .github/workflows/database.yml. Replace GENESIS_SHA with the commit of
# the Genesis release you run (docs/APP-CI.md in marktiderman/genesis says how).
name: Database

on:
  pull_request:
    paths: ["supabase/**"]
  push:
    branches: [main]
    paths: ["supabase/**"]

permissions:
  contents: read

jobs:
  database:
    uses: marktiderman/genesis/.github/workflows/supabase-ci.yml@GENESIS_SHA # @marktiderman/genesis@X.Y.Z
    with:
      package-manager: pnpm # or bun, npm
      doctor: false # app-ci's doctor already runs the supabase pack; true for a database-only repo
