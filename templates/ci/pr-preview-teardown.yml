# Copy to .github/workflows/pr-preview-teardown.yml (`genesis add template previews` writes it).
#
# When a pull request closes (merged or not), delete its preview: the EAS channel `pr-<number>`
# and the branch of the same name that pr-preview.yml published to. A phone still on it heals by
# itself: EAS answers "There is no channel named pr-<number>", and genesis-native drops the override
# at its next check (channels.recover) and is back on its build's channel.
#
# It runs on pull_request_target, with the base branch's copy of this file, so a pull request
# can't change what runs with the token. It checks out nothing: eas-cli needs only the project id.
#
# A preview run still publishing when the pull request closes would make the channel again (EAS
# Workflows and GitHub Actions can't share a concurrency group). A closed pull request starts no
# new run, so the job deletes, waits until EAS has no pr-preview.yml run queued or running (up to
# 45 minutes; EAS can't say which pull request a run is for, so it waits for all of them), and
# deletes once more.
#
# Needs the repository secret EXPO_TOKEN (an Expo robot token with access to the project): a
# repository secret, not an environment's, because an environment limited to main can't serve a
# pull request's event. And the repository variable EAS_PROJECT_ID (expo.dev → the project →
# its ID), so eas-cli can name the project without the app's config.
#
# Genesis template (templates/ci/pr-preview-teardown.yml); see docs/NATIVE-RELEASE.md, "Previews".
name: PR preview teardown

on:
  pull_request_target:
    types: [closed]

permissions: {}

concurrency:
  group: pr-preview-teardown-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  teardown:
    name: Delete the preview channel and branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      CHANNEL: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Delete pr-<number>
        run: |
          set -u
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EAS_PROJECT_ID" ]; then
            echo "::warning::EXPO_TOKEN (secret) or EAS_PROJECT_ID (variable) isn't set: the preview $CHANNEL is left on EAS."
            exit 0
          fi
          dir="$(mktemp -d)"
          # eas-cli finds the project from a package root and its Expo config: the smallest of both.
          printf '{"name":"preview-teardown","private":true}' > "$dir/package.json"
          printf '{"expo":{"name":"preview-teardown","slug":"preview-teardown","extra":{"eas":{"projectId":"%s"}}}}' "$EAS_PROJECT_ID" > "$dir/app.json"
          cd "$dir"
          failed=0
          eas() { npx --yes eas-cli@26.0.0 "$@"; }
          # Whether a channel or branch named $CHANNEL exists, from EAS's own list (25 a page): 0 yes, 1 no, 2 couldn't tell.
          exists() {
            local kind="$1" offset=0 page
            while :; do
              page="$(eas "$kind:list" --json --non-interactive --limit 25 --offset "$offset" 2>/dev/null)" || return 2
              case "$(printf '%s' "$page" | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{const want=process.argv[1];let j;try{j=JSON.parse(s)}catch{process.stdout.write("bad");return}const list=Array.isArray(j)?j:Object.values(j).find(Array.isArray)||[];process.stdout.write(list.some((x)=>x&&x.name===want)?"yes":list.length<25?"no":"more")})' "$CHANNEL")" in
                yes) return 0 ;;
                no) return 1 ;;
                more) offset=$((offset + 25)) ;;
                *) return 2 ;;
              esac
            done
          }
          # Delete it; a failed delete is fine only when EAS's list confirms it's gone.
          remove() {
            local kind="$1" out
            if out="$(eas "$kind:delete" "$CHANNEL" --non-interactive 2>&1)"; then
              echo "Deleted $kind $CHANNEL."
              return
            fi
            exists "$kind"
            case $? in
              1) echo "No $kind $CHANNEL." ;;
              *)
                printf '%s\n' "$out"
                echo "::error::Couldn't delete the $kind $CHANNEL."
                failed=1
                ;;
            esac
          }
          sweep() {
            # The channel first: EAS won't delete a branch a channel still points at.
            remove channel
            remove branch
          }
          # How many pr-preview.yml runs EAS has queued, waiting or running.
          pending() {
            local total=0 n status
            for status in NEW WAITING IN_PROGRESS ACTION_REQUIRED; do
              n="$(eas workflow:runs --workflow pr-preview.yml --status "$status" --limit 100 --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const l=Array.isArray(j)?j:Object.values(j).find(Array.isArray)||[];process.stdout.write(String(l.length))}catch{process.stdout.write("x")}})')"
              [ "$n" = "x" ] && { echo "unknown"; return; }
              total=$((total + n))
            done
            echo "$total"
          }
          sweep
          for _ in $(seq 1 45); do
            left="$(pending)"
            [ "$left" = "0" ] && break
            echo "Waiting for $left preview run(s) on EAS to finish…"
            sleep 60
          done
          sweep
          if [ "$left" != "0" ]; then
            # A run still open (or EAS couldn't say) may publish after this: fail so the run shows,
            # and re-running this job once EAS is quiet finishes the cleanup.
            echo "::error::EAS still had $left preview run(s) open after 45 minutes; re-run this job once they finish to delete $CHANNEL for good."
            failed=1
          fi
          exit "$failed"
