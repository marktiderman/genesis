# Signs in with MAESTRO_TEST_EMAIL and MAESTRO_TEST_PASSWORD from the sign-in screen and waits for
# the Home tab. Not a flow of its own: flows/ runs it with `runFlow`.
appId: com.example.genesisstarter.dev
---
- extendedWaitUntil:
    visible:
      id: "auth-screen"
    timeout: 20000
- tapOn:
    id: "auth-screen-form-email"
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    id: "auth-screen-form-password"
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn:
    id: "auth-screen-form-submit"
- extendedWaitUntil:
    visible:
      id: "home"
    timeout: 20000
