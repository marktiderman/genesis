# Deploy to production on every merge to main. main is protected (pull requests only, and only the
# people allowed to merge into it), so that merge is the release's approval.
#
# 1. Fingerprint the native project as the production variant builds it.
# 2. Per platform, look for a production build with that fingerprint.
#    - One exists (JavaScript only): publish an over-the-air update to the `production` channel, to
#      every install.
#    - None (native code changed): build one and submit it in the same run. Installs can't take an
#      update across a native change, so the new code reaches phones through the new build.
#
# A merge that changes native code is a new store version once it's released: bump `version` in
# app.config.ts in the same change when you mean to release it. The build number goes up by itself
# (eas.json autoIncrement).
#
# Safety:
# - A push to main is the only trigger, so a run always builds a commit in git, never a local
#   folder. `eas workflow:run` can start it anyway (and without `--ref` uploads the working
#   directory), so the first job runs only for a push to main and a manual run does nothing.
# - Runs are serialized (`concurrency`): two quick merges never publish out of order.
# - Updates go to every install, not a staged share: EAS refuses a second rollout on the same
#   channel, platform and runtime while one is in progress, so a staged update would make the next
#   merge's update fail. To take one back, republish the update before it
#   (`eas update:republish --group <id>`); rollout.yml does that for a staged one.
# - A build is submitted in the same run that made it, so an update never goes to a production
#   build that nobody has. If a submit fails, submit that build by hand before the next merge
#   (`eas submit --platform ios --id <build id> --profile production`).
# - Builds go to TestFlight and to the Play internal track as a draft (eas.json `submit`);
#   releasing to the stores stays a person's step in App Store Connect and Play Console.
# - Each platform's build or update is its own: a failure on one doesn't hold the other back.
#
# Genesis template (templates/eas/workflows/deploy-production.yml). Edit the copy in your app; see
# docs/NATIVE-RELEASE.md in the Genesis repository.
name: Deploy production

on:
  push:
    branches: [main]

# One deploy at a time. The running one always finishes (no cancel_in_progress); the newest merge
# waits for it and EAS drops the runs in between, so an older merge never publishes last.
concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  fingerprint:
    name: Fingerprint
    # Only a push to main. `eas workflow:run` starts any workflow whatever its `on` says, and
    # without --ref it uploads a local folder; skipping here skips every job after it.
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    type: fingerprint
    environment: production
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_VARIANT: production

  get_ios_build:
    name: Find a production iOS build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  get_android_build:
    name: Find a production Android build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    name: Build iOS (native code changed)
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android (native code changed)
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    environment: production
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit iOS to TestFlight
    needs: [build_ios]
    if: ${{ needs.build_ios.outputs.build_id }}
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_android:
    name: Submit Android to the internal track (draft)
    needs: [build_android]
    if: ${{ needs.build_android.outputs.build_id }}
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  update_ios:
    name: Update iOS (every production install)
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_VARIANT: production
    params:
      channel: production
      platform: ios
      # No rollout_percentage: unset, the update goes to every install. Set to 100, EAS published
      # it as a rollout and a consumer app's update job failed ("GraphQL request failed").
      # Explicit: unset, EAS tries a Sentry source map upload whenever @sentry/react-native is
      # installed and only logs a failure. Set true once the Sentry plugin is on in app.config.ts
      # (with SENTRY_AUTH_TOKEN), so a failed upload fails the job.
      upload_sentry_sourcemaps: false

  update_android:
    name: Update Android (every production install)
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: production
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_VARIANT: production
    params:
      channel: production
      platform: android
      # No rollout_percentage: unset, the update goes to every install. Set to 100, EAS published
      # it as a rollout and a consumer app's update job failed ("GraphQL request failed").
      # Explicit: unset, EAS tries a Sentry source map upload whenever @sentry/react-native is
      # installed and only logs a failure. Set true once the Sentry plugin is on in app.config.ts
      # (with SENTRY_AUTH_TOKEN), so a failed upload fails the job.
      upload_sentry_sourcemaps: false
