# Copy to .eas/workflows/pr-preview.yml.
# Rendered first: `genesis add template release` (or `genesis init --template native`) writes it
# with genesis.config.json `release`. Copying by hand, copy a rendered file (the RN starter's, or
# the CLI's output), never this template: its `#@if` lines and release tokens only work rendered.
#
# PR preview: each pull request on its own update channel, `pr-<number>`, opened by a link in the
# app people already have (channel surfing, genesis-native `PreviewScreen`).
#
# 1. Fingerprint the native project as the release builds it (GENESIS_RELEASE_PROFILE).
# 2. A release build (store or TestFlight) with that fingerprint exists, so the pull request changed
#    no native code: publish its JavaScript to the branch `pr-<number>` and point the channel
#    `pr-<number>` at it. Any phone with that build opens it from the preview link.
# 3. None exists (the pull request changed native code): an update can't load on any build out
#    there, so a preview build is made instead: the preview variant's build with the same
#    fingerprint is repacked with this JavaScript, or one is built (iOS only with PREVIEW_IOS=true:
#    an internal build needs registered devices).
# 4. One comment on the pull request: the preview link (a universal link on the web origin of
#    release.previews.origin when set), a QR code for the app's scheme, and what was
#    published. pr-preview-teardown.yml deletes the channel and branch when the pull request closes.
#
# When it runs (each run is up to two EAS builds or repacks, so the default is narrow):
# - A pull request into main that changes the app: its code folder or the config a build reads. A
#   docs-only pull request, or one into another branch, starts nothing.
#   The first path is the app's code folder. `genesis init --template native` fills in `src` (the
#   starter keeps its code there); in a copy made by hand, replace the placeholder: `src`, or
#   `apps/<name>` in a monorepo. An app with code in other top-level folders (`app/`,
#   `components/`) lists each. Until it's replaced only the config files start a run, and
#   `genesis doctor` warns about it (rule eas-placeholder).
# - Any pull request labeled `Preview` (create the label in GitHub), whatever it changes. A pull
#   request that also matches the paths can start two runs (one per trigger); `concurrency` keeps
#   one per branch, cancelling the older, and does the same when a new push supersedes a run.
# To widen it, add branches or paths; to run on every pull request, delete `branches` and `paths`.
#
# The preview build fallback (step 3) is Android from the start; iOS is off until you turn it on.
# An iOS preview build is an internal (ad hoc) build, which installs only on devices registered
# before it was built (`eas device:create`). Register a device, then add the plain variable
# PREVIEW_IOS=true to the preview EAS environment. The update in step 2 needs neither: it loads on
# the TestFlight or store build people already have.
#
# Nothing here can reach production: no submit or rollout job, and the update goes only to the
# branch and channel pr-<number>, never the release channel. The update is the pull request's
# JavaScript built with the release's EAS environment (it must match the build it loads on), so
# that environment's variables are read by a pull request's code: keep anything a pull request
# mustn't read (server keys, signing secrets) out of it, on the server where the app can't see it
# anyway. EAS doesn't run pull_request workflows for pull requests from forks.
#
# Genesis template (templates/release/pr-preview.yml), rendered with genesis.config.json
# `release` (its platforms, and `paths` after the app's own); see docs/NATIVE-RELEASE.md in the
# Genesis repository.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "REPLACE_WITH_APP_FOLDER/**"
      - "app.json"
      - "app.config.*"
      - "eas.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "package-lock.json"
      - "bun.lock"
      - "bun.lockb"
      # genesis.config.json release.paths: folders outside the app its bundle reads.
      #@extra-paths
  pull_request_labeled:
    labels: [Preview]

# One run per branch: a newer run (a push, or the Preview label on a pull request that also
# matched the paths) cancels the one in progress.
concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  fingerprint:
    name: Fingerprint (as the release builds it)
    type: fingerprint
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"

#@if ios
  get_release_ios_build:
    name: Find a release iOS build with this fingerprint
    needs: [fingerprint]
    type: get-build
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    params:
      platform: ios
      profile: GENESIS_RELEASE_PROFILE
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
#@end

#@if android
  get_release_android_build:
    name: Find a release Android build with this fingerprint
    needs: [fingerprint]
    type: get-build
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    params:
      platform: android
      profile: GENESIS_RELEASE_PROFILE
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
#@end

  publish_update:
    name: Publish to channel pr-<number>
#@if ios android
    needs: [get_release_ios_build, get_release_android_build]
#@end
#@if ios !android
    needs: [get_release_ios_build]
#@end
#@if android !ios
    needs: [get_release_android_build]
#@end
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      PREVIEW_CHANNEL: pr-${{ github.event.pull_request.number }}
      PREVIEW_ORIGIN: "GENESIS_RELEASE_PREVIEW_ORIGIN"
      PREVIEW_SCHEME: "GENESIS_RELEASE_PREVIEW_SCHEME"
      PR_TITLE: ${{ github.event.pull_request.title }}
#@if ios
      IOS_BUILD: ${{ needs.get_release_ios_build.outputs.build_id }}
#@end
#@if android
      ANDROID_BUILD: ${{ needs.get_release_android_build.outputs.build_id }}
#@end
    outputs:
      status: ${{ steps.publish.outputs.status }}
      message: ${{ steps.publish.outputs.message }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: publish
        name: Publish the update and point the channel at it
        run: |
          set -eo pipefail
          platforms=""
          [ -n "${IOS_BUILD:-}" ] && platforms="ios"
          [ -n "${ANDROID_BUILD:-}" ] && platforms="${platforms:+$platforms,}android"
          scheme_link="${PREVIEW_SCHEME:+$PREVIEW_SCHEME:///preview?channel=$PREVIEW_CHANNEL}"
          link="${PREVIEW_ORIGIN:+$PREVIEW_ORIGIN/preview?channel=$PREVIEW_CHANNEL}"
          link="${link:-$scheme_link}"
          qr_target="${scheme_link:-$link}"
          qr=""
          [ -n "$qr_target" ] && qr="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$qr_target")"
          # The comment, as one line (an output is one line): the link, the code, what was published.
          comment() {
            local body="<!-- genesis-pr-preview --> <b>Preview: $PREVIEW_CHANNEL</b><br>$1"
            [ -n "$qr" ] && [ "$2" = "link" ] && body="$body<br><img alt=\"Scan to open the preview\" width=\"180\" src=\"$qr\">"
            set-output message "$body<br><sub>The channel and its updates are deleted when this pull request closes.</sub>"
          }
          if [ -z "$platforms" ]; then
            # Native code changed: no build out there can load this; the preview build below covers it.
            set-output status "native"
            comment "This pull request changes native code, so it can't load in the app people have. Install the preview build from this run on expo.dev, or wait for a new store build." none
            exit 0
          fi
          npx --no genesis build-stamp --channel "$PREVIEW_CHANNEL"
          node .eas/scripts/native-release.mjs stamped build-metadata.json "$PREVIEW_CHANNEL"
          # The channel names the branch; both are created once, and kept in step on every push.
          npx --yes eas-cli@26.0.0 channel:create "$PREVIEW_CHANNEL" --non-interactive >/dev/null 2>&1 || true
          for p in ${platforms//,/ }; do
            env CI=1 EXPO_NO_DOTENV=1 npx --yes eas-cli@26.0.0 update --branch "$PREVIEW_CHANNEL" --platform "$p" \
              --environment "GENESIS_RELEASE_EAS_ENVIRONMENT" --message "PR ${PREVIEW_CHANNEL#pr-}: ${PR_TITLE}" --non-interactive
          done
          npx --yes eas-cli@26.0.0 channel:edit "$PREVIEW_CHANNEL" --branch "$PREVIEW_CHANNEL" --non-interactive
          set-output status "published:$platforms"
          comment "On a phone with the app ($platforms): <a href=\"$link\">$link</a>, or scan the code. The app asks before switching, shows a Preview banner while you're on it, and Leave goes back." link

#@if ios
  get_ios_build:
    name: Find a preview iOS build with this fingerprint
    needs: [publish_update]
    if: ${{ env.PREVIEW_IOS == 'true' && needs.publish_update.outputs.status == 'native' }}
    type: get-build
    environment: preview
    params:
      platform: ios
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  repack_ios:
    name: Repack the preview iOS build with this JavaScript
    needs: [get_ios_build]
    if: ${{ env.PREVIEW_IOS == 'true' && needs.get_ios_build.outputs.build_id }}
    type: repack
    environment: preview
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_APP_VARIANT: preview
    params:
      build_id: ${{ needs.get_ios_build.outputs.build_id }}
      profile: preview

  build_ios:
    name: Build a preview iOS build (native code changed)
    needs: [get_ios_build]
    if: ${{ env.PREVIEW_IOS == 'true' && needs.publish_update.outputs.status == 'native' && !needs.get_ios_build.outputs.build_id }}
    type: build
    environment: preview
    params:
      platform: ios
      profile: preview
#@end

#@if android
  get_android_build:
    name: Find a preview Android build with this fingerprint
    needs: [publish_update]
    if: ${{ needs.publish_update.outputs.status == 'native' }}
    type: get-build
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  repack_android:
    name: Repack the preview Android build with this JavaScript
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: repack
    environment: preview
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_APP_VARIANT: preview
    params:
      build_id: ${{ needs.get_android_build.outputs.build_id }}
      profile: preview

  build_android:
    name: Build a preview Android build (native code changed)
    needs: [get_android_build]
    if: ${{ needs.publish_update.outputs.status == 'native' && !needs.get_android_build.outputs.build_id }}
    type: build
    environment: preview
    params:
      platform: android
      profile: preview
#@end

  comment:
    name: Comment on the pull request
    needs: [publish_update]
    type: github-comment
    params:
      message: ${{ needs.publish_update.outputs.message }}
