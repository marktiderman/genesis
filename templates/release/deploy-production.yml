# Copy to .eas/workflows/deploy-production.yml.
#
# The native release lane's EAS half: a store build when native code changed, or an over-the-air
# update on a build that is still being made. It runs only when started, by
# .github/workflows/native-release.yml (GitHub Actions, which starts in seconds where an EAS job
# can queue for most of an hour) for the commit it couldn't publish itself:
#
#   eas workflow:run .eas/workflows/deploy-production.yml --ref <commit> -F commit_sha=<commit> \
#     -F ios=true -F ios_runtime_version=<…> -F android=false -F android_runtime_version=<…>
#
# The runtime versions come from native-release.yml, which computes them with the build profile's
# env (eas fingerprint:generate --build-profile, or your release.runtimeVersion command), so a
# build here is matched on the same value. To start a release by hand, run native-release.yml
# ("Run workflow" on main), which hands this workflow what it needs.
#
# native-release.yml runs on every push to main that changes the app. Per platform it finds the
# commit's runtime version; when a FINISHED production build has it and no run of this workflow
# is open, it publishes the update itself. Every other platform comes here, so each platform of
# each commit takes exactly one path and an update is never published twice. Here, per platform:
# - a build with the runtime version, finished or still building (get-build waits for one in
#   progress): publish this commit as an update on it;
# - none (native code changed): build, then submit to TestFlight / Google Play's internal track as
#   a draft. Releasing to the stores stays a person's step in App Store Connect and Play Console.
# A build EAS has queued but not started has no record yet, so a merge in that window builds
# again: a wasted build, nothing missed. Each platform's jobs are its own: a failure on one doesn't
# hold the other back.
#
# A merge that changes native code is a new store version once it's released: bump `version` in
# app.config.ts in the same change when you mean to release it. The build number goes up by itself
# (eas.json autoIncrement).
#
# Safety:
# - Started only by hand or by native-release.yml, never on push: two triggers would race on
#   every merge. The first job (`source`) fails, and so stops every other, unless the checkout is
#   commit_sha (started with --ref, not an uploaded folder) and main contains it.
# - Runs are serialized (`concurrency`): the running one always finishes before the next starts, so
#   runs publish in the order their commits reached main. EAS drops waiting runs in between; the
#   newest carries their code, and every platform (while a run is open, native-release.yml hands
#   every platform here).
# - The updates are published by the same steps as on GitHub (.eas/scripts/native-release.mjs):
#   the build profile's env (with the platform's overrides), the runtime version checked before
#   publishing and after. They need EXPO_TOKEN (an Expo robot token) in the EAS environment.
# - Updates go to every install, not a staged share (a staged one would make the next update
#   fail); rollout.yml promotes or reverts one you staged by hand.
# - A build is submitted in the run that made it, so an update never goes to a build nobody has.
#   If a submit fails, submit that build by hand before the next merge
#   (`eas submit --platform ios --id <build id> --profile GENESIS_RELEASE_PROFILE`).
#
# Genesis template (templates/release/deploy-production.yml), rendered with genesis.config.json
# `release`: change platforms, profile, channel, Sentry and the hook there, then
# `genesis add template release` (or the next genesis upgrade) writes this file again.
# docs/NATIVE-RELEASE.md in the Genesis repository.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        type: string
        required: true
        description: The commit being released, the same as --ref (a run started with workflow:run has no github.sha).
      repository:
        type: string
        required: false
        description: owner/name on GitHub, for the release hook.
#@if ios
      ios:
        # A choice, compared as text: eas workflow:run -F sends every value as a string, so a
        # boolean "false" would read as true.
        type: choice
        options: ["true", "false"]
        default: "true"
        description: Release iOS in this run.
      ios_runtime_version:
        type: string
        required: true
        description: iOS's runtime version, as native-release.yml computed it with the build profile's env.
#@end
#@if android
      android:
        # A choice, compared as text: eas workflow:run -F sends every value as a string, so a
        # boolean "false" would read as true.
        type: choice
        options: ["true", "false"]
        default: "true"
        description: Release Android in this run.
      android_runtime_version:
        type: string
        required: true
        description: Android's runtime version, as native-release.yml computed it with the build profile's env.
#@end

# One release at a time. No cancel_in_progress: the running one always finishes.
concurrency:
  group: ${{ workflow.filename }}

jobs:
  # Production releases only from main, fail-closed: the checkout must be commit_sha (started with
  # --ref <commit_sha>, not an uploaded folder) and main must contain it. Every other job waits on it.
  source:
    name: Check the commit is on main
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
    steps:
      - uses: eas/checkout
      - name: The checkout is commit_sha, and main contains it
        run: |
          set -eo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "$COMMIT_SHA" ]; then
            echo "The checkout is $head, not commit_sha $COMMIT_SHA: start this workflow with --ref $COMMIT_SHA. Nothing was built or published."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" FETCH_HEAD; then
            echo "$COMMIT_SHA isn't on main: production releases only from main. Nothing was built or published."
            exit 1
          fi

#@if ios
  get_ios_build:
    name: Find a production iOS build with this runtime version
    needs: [source]
    if: ${{ inputs.ios == 'true' }}
    type: get-build
    params:
      platform: ios
      profile: "GENESIS_RELEASE_PROFILE"
#@if fingerprint
      fingerprint_hash: ${{ inputs.ios_runtime_version }}
#@end
#@if !fingerprint
      runtime_version: ${{ inputs.ios_runtime_version }}
#@end
      # A JavaScript-only merge that landed while an earlier merge's build was running: wait for
      # that build and ship this commit as an update on it, instead of starting a second build.
      wait_for_in_progress: true

  build_ios:
    name: Build iOS (native code changed)
    needs: [get_ios_build]
    if: ${{ inputs.ios == 'true' && !needs.get_ios_build.outputs.build_id }}
    type: build
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    params:
      platform: ios
      profile: "GENESIS_RELEASE_PROFILE"

  submit_ios:
    name: Submit iOS to TestFlight
    needs: [build_ios]
    if: ${{ needs.build_ios.outputs.build_id }}
    type: submit
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: "GENESIS_RELEASE_PROFILE"

  # The same steps as native-release.yml's publish: the build profile's env (eas update doesn't
  # apply eas.json's), the runtime version checked before and after, every install (no rollout).
  update_ios:
    name: Update iOS (every production install)
    needs: [get_ios_build]
    if: ${{ inputs.ios == 'true' && needs.get_ios_build.outputs.build_id }}
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      RUNTIME_VERSION: ${{ needs.get_ios_build.outputs.runtime_version }}
      # The commit the build was made from: a later commit that changed native code may have built
      # (with no update yet) before this older one's run got here.
      BUILD_COMMIT: ${{ needs.get_ios_build.outputs.git_commit_hash }}
    outputs:
      update_group: ${{ steps.publish.outputs.update_group }}
    steps:
      - uses: eas/checkout
      # EAS CLI evaluates app.config.ts (and expo-updates resolves the runtime), so it needs the packages.
      - uses: eas/install_node_modules
      - id: publish
        name: Publish the iOS update
        run: |
          set -eo pipefail
          # Runs can land out of order: when the channel's latest iOS update already carries this
          # commit or a later one, publishing would put older code back. Said, and nothing published.
          latest=$(RELEASE_EAS="npx --yes eas-cli@26.0.0" node .eas/scripts/native-release.mjs latest-commit "GENESIS_RELEASE_CHANNEL" ios)
          for commit in $latest; do
            git cat-file -e "$commit^{commit}" 2>/dev/null || git fetch --quiet origin "$commit" 2>/dev/null || true
            if git merge-base --is-ancestor "$COMMIT_SHA" "$commit" 2>/dev/null; then
              echo "Not published: the channel's latest iOS update ($commit) already carries $COMMIT_SHA or a later commit."
              set-output update_group ""
              exit 0
            fi
          done
          if [ -n "$BUILD_COMMIT" ]; then
            git cat-file -e "$BUILD_COMMIT^{commit}" 2>/dev/null || git fetch --quiet origin "$BUILD_COMMIT" 2>/dev/null || true
            if git merge-base --is-ancestor "$COMMIT_SHA" "$BUILD_COMMIT" 2>/dev/null; then
              echo "Not published: the iOS build this update would run on was made from $BUILD_COMMIT, which already carries $COMMIT_SHA."
              set-output update_group ""
              exit 0
            fi
          fi
#@if sentry
          # Before anything is published: the source map upload after it needs its token and the
          # app's own uploader.
          node .eas/scripts/native-release.mjs require SENTRY_AUTH_TOKEN
          node .eas/scripts/native-release.mjs installed @sentry/react-native
#@end
          # Assigned first: a failing profile-env fails the step (eval "$(…)" would hide it).
          profile_env=$(node .eas/scripts/native-release.mjs profile-env eas.json "GENESIS_RELEASE_PROFILE" ios --shell)
          eval "$profile_env"
          npx --no expo-updates runtimeversion:resolve --platform ios > resolved-ios.txt
          node .eas/scripts/native-release.mjs runtime resolved-ios.txt ios "$RUNTIME_VERSION"
          npx --yes eas-cli@26.0.0 update --channel "GENESIS_RELEASE_CHANNEL" --platform ios --environment "GENESIS_RELEASE_EAS_ENVIRONMENT" --message "Release $COMMIT_SHA" --json --non-interactive > update-ios.json
          out=$(node .eas/scripts/native-release.mjs update update-ios.json ios "$RUNTIME_VERSION")
          echo "$out"
          set-output update_group "$(echo "$out" | sed -n 's/^ios_update_group=//p')"
#@if sentry
          # A failed upload fails the job (needs SENTRY_AUTH_TOKEN in the EAS environment). The app's own
          # sentry-expo-upload-sourcemaps: npx --no never installs one (an unrelated npm package has the name).
          npx --no sentry-expo-upload-sourcemaps dist
#@end
#@if pushHook

  hook_ios_update:
    name: Run the release hook (iOS update)
    needs: [get_ios_build, update_ios]
    # Only when an update went out (not when the channel already carried this commit).
    if: ${{ needs.update_ios.outputs.update_group }}
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      RELEASE_KIND: update
      RELEASE_PLATFORM: ios
      RELEASE_COMMIT: ${{ inputs.commit_sha }}
      RELEASE_REPOSITORY: ${{ inputs.repository }}
      RELEASE_CHANNEL: "GENESIS_RELEASE_CHANNEL"
      RELEASE_APP_VERSION: ${{ needs.get_ios_build.outputs.app_version }}
      RELEASE_RUNTIME_VERSION: ${{ needs.get_ios_build.outputs.runtime_version }}
      RELEASE_UPDATE_GROUP: ${{ needs.update_ios.outputs.update_group }}
    steps:
      - uses: eas/checkout
      - name: Run GENESIS_RELEASE_PUSH_HOOK
        run: node GENESIS_RELEASE_PUSH_HOOK

  hook_ios_build:
    name: Run the release hook (iOS build)
    needs: [build_ios, submit_ios]
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      RELEASE_KIND: build
      RELEASE_PLATFORM: ios
      RELEASE_COMMIT: ${{ inputs.commit_sha }}
      RELEASE_REPOSITORY: ${{ inputs.repository }}
      RELEASE_CHANNEL: "GENESIS_RELEASE_CHANNEL"
      RELEASE_APP_VERSION: ${{ needs.build_ios.outputs.app_version }}
      RELEASE_RUNTIME_VERSION: ${{ needs.build_ios.outputs.runtime_version }}
      RELEASE_BUILD_ID: ${{ needs.build_ios.outputs.build_id }}
      RELEASE_BUILD_NUMBER: ${{ needs.build_ios.outputs.app_build_version }}
    steps:
      - uses: eas/checkout
      - name: Run GENESIS_RELEASE_PUSH_HOOK
        run: node GENESIS_RELEASE_PUSH_HOOK
#@end
#@end
#@if android

  get_android_build:
    name: Find a production Android build with this runtime version
    needs: [source]
    if: ${{ inputs.android == 'true' }}
    type: get-build
    params:
      platform: android
      profile: "GENESIS_RELEASE_PROFILE"
#@if fingerprint
      fingerprint_hash: ${{ inputs.android_runtime_version }}
#@end
#@if !fingerprint
      runtime_version: ${{ inputs.android_runtime_version }}
#@end
      # A JavaScript-only merge that landed while an earlier merge's build was running: wait for
      # that build and ship this commit as an update on it, instead of starting a second build.
      wait_for_in_progress: true

  build_android:
    name: Build Android (native code changed)
    needs: [get_android_build]
    if: ${{ inputs.android == 'true' && !needs.get_android_build.outputs.build_id }}
    type: build
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    params:
      platform: android
      profile: "GENESIS_RELEASE_PROFILE"

  submit_android:
    name: Submit Android to the internal track (draft)
    needs: [build_android]
    if: ${{ needs.build_android.outputs.build_id }}
    type: submit
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: "GENESIS_RELEASE_PROFILE"

  # The same steps as native-release.yml's publish: the build profile's env (eas update doesn't
  # apply eas.json's), the runtime version checked before and after, every install (no rollout).
  update_android:
    name: Update Android (every production install)
    needs: [get_android_build]
    if: ${{ inputs.android == 'true' && needs.get_android_build.outputs.build_id }}
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      RUNTIME_VERSION: ${{ needs.get_android_build.outputs.runtime_version }}
      # The commit the build was made from: a later commit that changed native code may have built
      # (with no update yet) before this older one's run got here.
      BUILD_COMMIT: ${{ needs.get_android_build.outputs.git_commit_hash }}
    outputs:
      update_group: ${{ steps.publish.outputs.update_group }}
    steps:
      - uses: eas/checkout
      # EAS CLI evaluates app.config.ts (and expo-updates resolves the runtime), so it needs the packages.
      - uses: eas/install_node_modules
      - id: publish
        name: Publish the Android update
        run: |
          set -eo pipefail
          # Runs can land out of order: when the channel's latest Android update already carries this
          # commit or a later one, publishing would put older code back. Said, and nothing published.
          latest=$(RELEASE_EAS="npx --yes eas-cli@26.0.0" node .eas/scripts/native-release.mjs latest-commit "GENESIS_RELEASE_CHANNEL" android)
          for commit in $latest; do
            git cat-file -e "$commit^{commit}" 2>/dev/null || git fetch --quiet origin "$commit" 2>/dev/null || true
            if git merge-base --is-ancestor "$COMMIT_SHA" "$commit" 2>/dev/null; then
              echo "Not published: the channel's latest Android update ($commit) already carries $COMMIT_SHA or a later commit."
              set-output update_group ""
              exit 0
            fi
          done
          if [ -n "$BUILD_COMMIT" ]; then
            git cat-file -e "$BUILD_COMMIT^{commit}" 2>/dev/null || git fetch --quiet origin "$BUILD_COMMIT" 2>/dev/null || true
            if git merge-base --is-ancestor "$COMMIT_SHA" "$BUILD_COMMIT" 2>/dev/null; then
              echo "Not published: the Android build this update would run on was made from $BUILD_COMMIT, which already carries $COMMIT_SHA."
              set-output update_group ""
              exit 0
            fi
          fi
#@if sentry
          # Before anything is published: the source map upload after it needs its token and the
          # app's own uploader.
          node .eas/scripts/native-release.mjs require SENTRY_AUTH_TOKEN
          node .eas/scripts/native-release.mjs installed @sentry/react-native
#@end
          # Assigned first: a failing profile-env fails the step (eval "$(…)" would hide it).
          profile_env=$(node .eas/scripts/native-release.mjs profile-env eas.json "GENESIS_RELEASE_PROFILE" android --shell)
          eval "$profile_env"
          npx --no expo-updates runtimeversion:resolve --platform android > resolved-android.txt
          node .eas/scripts/native-release.mjs runtime resolved-android.txt android "$RUNTIME_VERSION"
          npx --yes eas-cli@26.0.0 update --channel "GENESIS_RELEASE_CHANNEL" --platform android --environment "GENESIS_RELEASE_EAS_ENVIRONMENT" --message "Release $COMMIT_SHA" --json --non-interactive > update-android.json
          out=$(node .eas/scripts/native-release.mjs update update-android.json android "$RUNTIME_VERSION")
          echo "$out"
          set-output update_group "$(echo "$out" | sed -n 's/^android_update_group=//p')"
#@if sentry
          # A failed upload fails the job (needs SENTRY_AUTH_TOKEN in the EAS environment). The app's own
          # sentry-expo-upload-sourcemaps: npx --no never installs one (an unrelated npm package has the name).
          npx --no sentry-expo-upload-sourcemaps dist
#@end
#@if pushHook

  hook_android_update:
    name: Run the release hook (Android update)
    needs: [get_android_build, update_android]
    # Only when an update went out (not when the channel already carried this commit).
    if: ${{ needs.update_android.outputs.update_group }}
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      RELEASE_KIND: update
      RELEASE_PLATFORM: android
      RELEASE_COMMIT: ${{ inputs.commit_sha }}
      RELEASE_REPOSITORY: ${{ inputs.repository }}
      RELEASE_CHANNEL: "GENESIS_RELEASE_CHANNEL"
      RELEASE_APP_VERSION: ${{ needs.get_android_build.outputs.app_version }}
      RELEASE_RUNTIME_VERSION: ${{ needs.get_android_build.outputs.runtime_version }}
      RELEASE_UPDATE_GROUP: ${{ needs.update_android.outputs.update_group }}
    steps:
      - uses: eas/checkout
      - name: Run GENESIS_RELEASE_PUSH_HOOK
        run: node GENESIS_RELEASE_PUSH_HOOK

  hook_android_build:
    name: Run the release hook (Android build)
    needs: [build_android, submit_android]
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      RELEASE_KIND: build
      RELEASE_PLATFORM: android
      RELEASE_COMMIT: ${{ inputs.commit_sha }}
      RELEASE_REPOSITORY: ${{ inputs.repository }}
      RELEASE_CHANNEL: "GENESIS_RELEASE_CHANNEL"
      RELEASE_APP_VERSION: ${{ needs.build_android.outputs.app_version }}
      RELEASE_RUNTIME_VERSION: ${{ needs.build_android.outputs.runtime_version }}
      RELEASE_BUILD_ID: ${{ needs.build_android.outputs.build_id }}
      RELEASE_BUILD_NUMBER: ${{ needs.build_android.outputs.app_build_version }}
    steps:
      - uses: eas/checkout
      - name: Run GENESIS_RELEASE_PUSH_HOOK
        run: node GENESIS_RELEASE_PUSH_HOOK
#@end
#@end
