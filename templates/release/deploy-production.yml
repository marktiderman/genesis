# Copy to .eas/workflows/deploy-production.yml.
# Rendered by genesis from genesis.config.json `release` (genesis add template release, genesis
# upgrade): change the lane there. docs/NATIVE-RELEASE.md, docs/adr/0026-eas-owns-the-release-trigger.md.
#@if !githubTrigger
# Expo's deploy-to-production lane, on every push to main that changes the app, or by hand:
# eas workflow:run deploy-production.yml --ref main.
#@end
#@if githubTrigger
# Started only by .github/workflows/native-release.yml (release.trigger "github").
#@end
# Per platform: a build with the runtime version takes the commit as an update; none builds and
# submits. The publishing lives in .eas/scripts/native-release.mjs: EAS takes files up to 16 KiB.
name: Deploy production

on:
#@if !githubTrigger
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!.github/**"
      - "!.eas/**"
      - "!.maestro/**"
      #@extra-paths
      #@root-install-paths
  workflow_dispatch: {}
#@end
#@if githubTrigger
  workflow_dispatch:
    # Choices, compared as text: -F sends strings.
    inputs:
      commit_sha:
        type: string
        required: true
        description: The commit released, the same as --ref.
      repository:
        type: string
        required: false
        description: owner/name on GitHub, for the release hook.
      handoff:
        type: string
        required: false
        description: Set by native-release.yml; without it a run is refused unless manual is true.
      manual:
        type: choice
        options: ["false", "true"]
        default: "false"
        description: Release without native-release.yml (its order checks can then race GitHub's).
#@if ios
      ios:
        type: choice
        options: ["true", "false"]
        default: "true"
        description: Release iOS in this run.
      ios_runtime_version:
        type: string
        required: true
        description: iOS's runtime version, as native-release.yml computed it.
#@end
#@if android
      android:
        type: choice
        options: ["true", "false"]
        default: "true"
        description: Release Android in this run.
      android_runtime_version:
        type: string
        required: true
        description: Android's runtime version, as native-release.yml computed it.
#@end
#@end

# One release at a time; the running one always finishes.
concurrency:
  group: ${{ workflow.filename }}
#@if githubTrigger
  # Every waiting run kept: one for a platform never replaces one for the other.
  queue: max
#@end
#@if !githubTrigger
  # The newest waiting run replaces those in between (Expo's deploy default).
#@end

jobs:
  # Fail-closed: main contains the commit, the checkout is it, and eas.json matches this file.
  source:
    name: The commit is on main
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
#@if !githubTrigger
      EVENT: ${{ github.event_name }}
      # Empty when started by hand: the checkout's commit, and origin's repository.
      COMMIT_SHA: ${{ github.sha }}
      REPOSITORY: ${{ github.repository }}
#@end
#@if githubTrigger
      COMMIT_SHA: ${{ inputs.commit_sha }}
      REPOSITORY: ${{ inputs.repository }}
      HANDOFF: ${{ inputs.handoff }}
      MANUAL: ${{ inputs.manual }}
#@if ios
      RELEASE_IOS: ${{ inputs.ios }}
#@end
#@if android
      RELEASE_ANDROID: ${{ inputs.android }}
#@end
#@end
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      repository: ${{ steps.commit.outputs.repository }}
#@if ios
      ios: ${{ steps.check.outputs.ios }}
#@end
#@if android
      android: ${{ steps.check.outputs.android }}
#@end
    steps:
      - uses: eas/checkout
      - id: commit
        name: The commit is on main, and is what was checked out
        run: |
          set -eo pipefail
#@if githubTrigger
          if [ "$HANDOFF" != native-release ] && [ "$MANUAL" != true ]; then
            echo "Start releases with native-release.yml (Actions, Run workflow, on main), or pass -F manual=true. Nothing was built or published."
            exit 1
          fi
#@end
          if ! head=$(git rev-parse HEAD 2>/dev/null); then
            echo "This run has no git checkout (an uploaded folder): start it with --ref main. Nothing was built or published."
            exit 1
          fi
#@if !githubTrigger
          COMMIT_SHA="${COMMIT_SHA:-$head}"
#@end
          if [ "$head" != "$COMMIT_SHA" ]; then
            echo "The checkout is $head, not $COMMIT_SHA: start this workflow with --ref $COMMIT_SHA. Nothing was built or published."
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "The checkout has changes that aren't in $COMMIT_SHA: start this workflow with --ref main. Nothing was built or published."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" FETCH_HEAD; then
            echo "$COMMIT_SHA isn't on main: production releases only from main. Nothing was built or published."
            exit 1
          fi
#@if !githubTrigger
          # By hand, only main's tip. A GitHub push names its repository; eas workflow:run
          # --git-commit-hash reads as a push with none, so it counts as by hand.
          if { [ "$EVENT" != push ] || [ -z "$REPOSITORY" ]; } && [ "$COMMIT_SHA" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "$COMMIT_SHA isn't main's latest commit: a release by hand ships main as it is (--ref main). Nothing was built or published."
            exit 1
          fi
          if [ -z "$REPOSITORY" ]; then
            REPOSITORY=$(git remote get-url origin 2>/dev/null | sed -E 's#\.git$##; s#^.*github\.com[:/]##') || REPOSITORY=""
          fi
#@end
          set-output commit_sha "$COMMIT_SHA"
          set-output repository "$REPOSITORY"
      - id: check
        name: eas.json matches; the platforms released
        run: |
          set -eo pipefail
#@if githubTrigger
          platforms=""
          if [ "${RELEASE_IOS:-false}" = true ]; then platforms=ios; fi
          if [ "${RELEASE_ANDROID:-false}" = true ]; then platforms="${platforms:+$platforms,}android"; fi
#@end
#@if !githubTrigger
          platforms="GENESIS_RELEASE_PLATFORMS"
#@end
          if [ -n "$platforms" ]; then
            node .eas/scripts/native-release.mjs channel eas.json "GENESIS_RELEASE_PROFILE" "GENESIS_RELEASE_CHANNEL"
            node .eas/scripts/native-release.mjs environment eas.json "GENESIS_RELEASE_PROFILE" "GENESIS_RELEASE_EAS_ENVIRONMENT" "$platforms"
          fi
          for platform in ios android; do
            case ",$platforms," in *",$platform,"*) set-output "$platform" true ;; *) set-output "$platform" false ;; esac
          done
#@if ios

  # Its own job: a failure here holds back iOS alone.
  runtime_ios:
    name: Find iOS's runtime version
    needs: [source]
    if: ${{ needs.source.outputs.ios == 'true' }}
#@if !githubTrigger
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      RELEASE_PROFILE: "GENESIS_RELEASE_PROFILE"
      RELEASE_EAS: npx --yes eas-cli@26.0.0
#@if !fingerprint
      RELEASE_RUNTIME_COMMAND: >-
        GENESIS_RELEASE_RUNTIME_COMMAND
#@end
#@end
#@if githubTrigger
    env:
      RUNTIME_VERSION: ${{ inputs.ios_runtime_version }}
#@end
    outputs:
      runtime_version: ${{ steps.runtime.outputs.runtime_version }}
    steps:
#@if !githubTrigger
      - uses: eas/checkout
      - uses: eas/install_node_modules
#@end
      - id: runtime
        run: |
          set -eo pipefail
#@if !githubTrigger
          RUNTIME_VERSION=$(node .eas/scripts/native-release.mjs runtime-version ios)
#@end
          echo "iOS runtime version: $RUNTIME_VERSION"
          set-output runtime_version "$RUNTIME_VERSION"

  get_ios_build:
    name: Find a production iOS build with this runtime version
    needs: [source, runtime_ios]
    if: ${{ needs.source.outputs.ios == 'true' }}
    type: get-build
    params:
      platform: ios
      profile: "GENESIS_RELEASE_PROFILE"
      channel: "GENESIS_RELEASE_CHANNEL"
#@if fingerprint
      fingerprint_hash: ${{ needs.runtime_ios.outputs.runtime_version }}
#@end
#@if !fingerprint
      runtime_version: ${{ needs.runtime_ios.outputs.runtime_version }}
#@end
      wait_for_in_progress: true

  build_ios:
    name: Build iOS (native code changed)
    needs: [source, get_ios_build]
    if: ${{ needs.source.outputs.ios == 'true' && !needs.get_ios_build.outputs.build_id }}
    type: build
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    params:
      platform: ios
      profile: "GENESIS_RELEASE_PROFILE"

  submit_ios:
    name: Submit iOS (TestFlight)
    needs: [build_ios]
    if: ${{ needs.build_ios.outputs.build_id }}
    type: submit
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: "GENESIS_RELEASE_PROFILE"

  # native-release.mjs publish: the order checks, the runtime check, the stamp, then eas update.
  update_ios:
    name: Update iOS (every production install)
    needs: [source, get_ios_build]
    if: ${{ needs.source.outputs.ios == 'true' && needs.get_ios_build.outputs.build_id }}
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      COMMIT_SHA: ${{ needs.source.outputs.commit_sha }}
      RUNTIME_VERSION: ${{ needs.get_ios_build.outputs.runtime_version }}
      BUILD_COMMIT: ${{ needs.get_ios_build.outputs.git_commit_hash }}
      RELEASE_CHANNEL: "GENESIS_RELEASE_CHANNEL"
      RELEASE_PROFILE: "GENESIS_RELEASE_PROFILE"
      RELEASE_EAS: npx --yes eas-cli@26.0.0
#@if sentry
      RELEASE_SENTRY: "true"
#@end
#@if pushHook
      RELEASE_HOOK: "true"
#@end
    outputs:
      update_group: ${{ steps.publish.outputs.update_group }}
#@if sentry pushHook
      sourcemaps: ${{ steps.publish.outputs.sourcemaps }}
#@end
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: publish
        name: Publish the iOS update
        run: |
          set -eo pipefail
          out=$(mktemp)
          node .eas/scripts/native-release.mjs publish ios "$out"
          while IFS='=' read -r key value; do set-output "$key" "$value"; done < "$out"
#@if pushHook

  hook_ios_update:
    name: Run the release hook (iOS update)
    needs: [source, get_ios_build, update_ios]
    if: ${{ needs.update_ios.outputs.update_group }}
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      RELEASE_KIND: update
      RELEASE_PLATFORM: ios
      RELEASE_COMMIT: ${{ needs.source.outputs.commit_sha }}
      RELEASE_REPOSITORY: ${{ needs.source.outputs.repository }}
      RELEASE_CHANNEL: "GENESIS_RELEASE_CHANNEL"
      RELEASE_APP_VERSION: ${{ needs.get_ios_build.outputs.app_version }}
      RELEASE_RUNTIME_VERSION: ${{ needs.get_ios_build.outputs.runtime_version }}
      RELEASE_UPDATE_GROUP: ${{ needs.update_ios.outputs.update_group }}
#@if sentry
      SOURCEMAPS: ${{ needs.update_ios.outputs.sourcemaps }}
#@end
    steps:
      - uses: eas/checkout
      - name: Run GENESIS_RELEASE_PUSH_HOOK
        run: node GENESIS_RELEASE_PUSH_HOOK
#@if sentry
      - name: The source maps reached Sentry
        run: |
          if [ "$SOURCEMAPS" = failed ]; then
            echo "The iOS update $RELEASE_UPDATE_GROUP is out, but its source maps didn't reach Sentry: upload them by hand."
            exit 1
          fi
#@end

  hook_ios_build:
    name: Run the release hook (iOS build)
    needs: [source, build_ios, submit_ios]
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      RELEASE_KIND: build
      RELEASE_PLATFORM: ios
      RELEASE_COMMIT: ${{ needs.source.outputs.commit_sha }}
      RELEASE_REPOSITORY: ${{ needs.source.outputs.repository }}
      RELEASE_CHANNEL: "GENESIS_RELEASE_CHANNEL"
      RELEASE_APP_VERSION: ${{ needs.build_ios.outputs.app_version }}
      RELEASE_RUNTIME_VERSION: ${{ needs.build_ios.outputs.runtime_version }}
      RELEASE_BUILD_ID: ${{ needs.build_ios.outputs.build_id }}
      RELEASE_BUILD_NUMBER: ${{ needs.build_ios.outputs.app_build_version }}
    steps:
      - uses: eas/checkout
      - name: Run GENESIS_RELEASE_PUSH_HOOK
        run: node GENESIS_RELEASE_PUSH_HOOK
#@end
#@end
#@if android

  # Its own job: a failure here holds back Android alone.
  runtime_android:
    name: Find Android's runtime version
    needs: [source]
    if: ${{ needs.source.outputs.android == 'true' }}
#@if !githubTrigger
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      RELEASE_PROFILE: "GENESIS_RELEASE_PROFILE"
      RELEASE_EAS: npx --yes eas-cli@26.0.0
#@if !fingerprint
      RELEASE_RUNTIME_COMMAND: >-
        GENESIS_RELEASE_RUNTIME_COMMAND
#@end
#@end
#@if githubTrigger
    env:
      RUNTIME_VERSION: ${{ inputs.android_runtime_version }}
#@end
    outputs:
      runtime_version: ${{ steps.runtime.outputs.runtime_version }}
    steps:
#@if !githubTrigger
      - uses: eas/checkout
      - uses: eas/install_node_modules
#@end
      - id: runtime
        run: |
          set -eo pipefail
#@if !githubTrigger
          RUNTIME_VERSION=$(node .eas/scripts/native-release.mjs runtime-version android)
#@end
          echo "Android runtime version: $RUNTIME_VERSION"
          set-output runtime_version "$RUNTIME_VERSION"

  get_android_build:
    name: Find a production Android build with this runtime version
    needs: [source, runtime_android]
    if: ${{ needs.source.outputs.android == 'true' }}
    type: get-build
    params:
      platform: android
      profile: "GENESIS_RELEASE_PROFILE"
      channel: "GENESIS_RELEASE_CHANNEL"
#@if fingerprint
      fingerprint_hash: ${{ needs.runtime_android.outputs.runtime_version }}
#@end
#@if !fingerprint
      runtime_version: ${{ needs.runtime_android.outputs.runtime_version }}
#@end
      wait_for_in_progress: true

  build_android:
    name: Build Android (native code changed)
    needs: [source, get_android_build]
    if: ${{ needs.source.outputs.android == 'true' && !needs.get_android_build.outputs.build_id }}
    type: build
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    params:
      platform: android
      profile: "GENESIS_RELEASE_PROFILE"

  submit_android:
    name: Submit Android (internal track, draft)
    needs: [build_android]
    if: ${{ needs.build_android.outputs.build_id }}
    type: submit
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: "GENESIS_RELEASE_PROFILE"

  # native-release.mjs publish: the order checks, the runtime check, the stamp, then eas update.
  update_android:
    name: Update Android (every production install)
    needs: [source, get_android_build]
    if: ${{ needs.source.outputs.android == 'true' && needs.get_android_build.outputs.build_id }}
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      COMMIT_SHA: ${{ needs.source.outputs.commit_sha }}
      RUNTIME_VERSION: ${{ needs.get_android_build.outputs.runtime_version }}
      BUILD_COMMIT: ${{ needs.get_android_build.outputs.git_commit_hash }}
      RELEASE_CHANNEL: "GENESIS_RELEASE_CHANNEL"
      RELEASE_PROFILE: "GENESIS_RELEASE_PROFILE"
      RELEASE_EAS: npx --yes eas-cli@26.0.0
#@if sentry
      RELEASE_SENTRY: "true"
#@end
#@if pushHook
      RELEASE_HOOK: "true"
#@end
    outputs:
      update_group: ${{ steps.publish.outputs.update_group }}
#@if sentry pushHook
      sourcemaps: ${{ steps.publish.outputs.sourcemaps }}
#@end
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: publish
        name: Publish the Android update
        run: |
          set -eo pipefail
          out=$(mktemp)
          node .eas/scripts/native-release.mjs publish android "$out"
          while IFS='=' read -r key value; do set-output "$key" "$value"; done < "$out"
#@if pushHook

  hook_android_update:
    name: Run the release hook (Android update)
    needs: [source, get_android_build, update_android]
    if: ${{ needs.update_android.outputs.update_group }}
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      RELEASE_KIND: update
      RELEASE_PLATFORM: android
      RELEASE_COMMIT: ${{ needs.source.outputs.commit_sha }}
      RELEASE_REPOSITORY: ${{ needs.source.outputs.repository }}
      RELEASE_CHANNEL: "GENESIS_RELEASE_CHANNEL"
      RELEASE_APP_VERSION: ${{ needs.get_android_build.outputs.app_version }}
      RELEASE_RUNTIME_VERSION: ${{ needs.get_android_build.outputs.runtime_version }}
      RELEASE_UPDATE_GROUP: ${{ needs.update_android.outputs.update_group }}
#@if sentry
      SOURCEMAPS: ${{ needs.update_android.outputs.sourcemaps }}
#@end
    steps:
      - uses: eas/checkout
      - name: Run GENESIS_RELEASE_PUSH_HOOK
        run: node GENESIS_RELEASE_PUSH_HOOK
#@if sentry
      - name: The source maps reached Sentry
        run: |
          if [ "$SOURCEMAPS" = failed ]; then
            echo "The Android update $RELEASE_UPDATE_GROUP is out, but its source maps didn't reach Sentry: upload them by hand."
            exit 1
          fi
#@end

  hook_android_build:
    name: Run the release hook (Android build)
    needs: [source, build_android, submit_android]
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      RELEASE_KIND: build
      RELEASE_PLATFORM: android
      RELEASE_COMMIT: ${{ needs.source.outputs.commit_sha }}
      RELEASE_REPOSITORY: ${{ needs.source.outputs.repository }}
      RELEASE_CHANNEL: "GENESIS_RELEASE_CHANNEL"
      RELEASE_APP_VERSION: ${{ needs.build_android.outputs.app_version }}
      RELEASE_RUNTIME_VERSION: ${{ needs.build_android.outputs.runtime_version }}
      RELEASE_BUILD_ID: ${{ needs.build_android.outputs.build_id }}
      RELEASE_BUILD_NUMBER: ${{ needs.build_android.outputs.app_build_version }}
    steps:
      - uses: eas/checkout
      - name: Run GENESIS_RELEASE_PUSH_HOOK
        run: node GENESIS_RELEASE_PUSH_HOOK
#@end
#@end

  # A failed run is a failed commit status, but nobody is emailed: posts to RELEASE_FAILURE_WEBHOOK
  # (an EAS secret) when set; release.failureEmails adds an email.
  release_failed:
    name: Say the release failed
    after:
      - source
#@if ios
      - runtime_ios
      - get_ios_build
      - build_ios
      - submit_ios
      - update_ios
#@if pushHook
      - hook_ios_update
      - hook_ios_build
#@end
#@end
#@if android
      - runtime_android
      - get_android_build
      - build_android
      - submit_android
      - update_android
#@if pushHook
      - hook_android_update
      - hook_android_build
#@end
#@end
    if: ${{ failure() }}
    environment: "GENESIS_RELEASE_EAS_ENVIRONMENT"
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_CHANNEL: "GENESIS_RELEASE_CHANNEL"
    steps:
      - uses: eas/checkout
      - name: Post the failure
        run: node .eas/scripts/native-release.mjs notify-failure
#@if failureEmails

  # Runs only when release_failed did, so only on a failure.
  release_failed_email:
    name: Email the failure
    needs: [release_failed]
    type: email
    params:
      emails: GENESIS_RELEASE_FAILURE_EMAILS
      subject: "The native release failed"
      body: |
        The native release of ${{ github.sha }} (${{ github.repository }}) failed on EAS. Some platforms may already have published an update or submitted a build: see the run on expo.dev (the project's Workflows).
#@end
