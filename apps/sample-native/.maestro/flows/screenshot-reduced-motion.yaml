# Maestro flow: capture screenshots with reduce-motion enabled.
#
# Prerequisites (set before running this flow):
#   iOS:     xcrun simctl spawn booted defaults write -g \
#              com.apple.UIKit.reduce-motion 1
#            xcrun simctl ui booted appearance light
#   Android: adb shell settings put global animator_duration_scale 0
#            adb shell settings put global transition_animation_scale 0
#            adb shell settings put global window_animation_scale 0
#            adb shell "cmd uimode night no"
#
# Goal: catch regressions where a primitive's reduced-motion behavior
# (or animated decoration like Skeleton shimmer) silently breaks.
appId: com.tiderman.genesis.sample
---
- launchApp:
    permissions:
      all: allow
    arguments:
      MAESTRO_SCREENSHOT_MODE: "true"
      MAESTRO_REDUCE_MOTION: "true"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/reduced-motion/home

- openLink: genesis-sample://components-showcase
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/reduced-motion/showcase-index

- openLink: genesis-sample://components-showcase/buttons
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/reduced-motion/buttons

- openLink: genesis-sample://components-showcase/cards
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/reduced-motion/cards

- openLink: genesis-sample://components-showcase/inputs
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/reduced-motion/inputs

- openLink: genesis-sample://components-showcase/badges
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/reduced-motion/badges

- openLink: genesis-sample://components-showcase/dialogs
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/reduced-motion/dialogs-closed
- tapOn:
    id: "dialog-open-trigger"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/reduced-motion/dialogs-open
- tapOn:
    id: "dialog-cancel"

- openLink: genesis-sample://components-showcase/alerts
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/reduced-motion/alerts

- openLink: genesis-sample://components-showcase/progress
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/reduced-motion/progress
