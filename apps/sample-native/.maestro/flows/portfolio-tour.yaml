- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "showcase-index"

- openLink: genesis-sample://components-showcase/buttons
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "showcase-buttons"

- openLink: genesis-sample://components-showcase/cards
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "showcase-cards"

- openLink: genesis-sample://components-showcase/inputs
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "showcase-inputs"

- openLink: genesis-sample://components-showcase/badges
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "showcase-badges"

- openLink: genesis-sample://components-showcase/alerts
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "showcase-alerts"

- openLink: genesis-sample://components-showcase/progress
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "showcase-progress"

- openLink: genesis-sample://components-showcase/dialogs
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "showcase-dialogs"
- tapOn:
    id: "dialog-open-trigger"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "dialog-content"
- tapOn:
    id: "dialog-cancel"

# ──────────────────────────────────────────────────────────────────────
# Layouts (5 placeholders)
# ──────────────────────────────────────────────────────────────────────
- openLink: genesis-sample://layouts
