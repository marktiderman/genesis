# Maestro flow: Phase G portfolio tour.
#
# Walks the entire Genesis Showcase end-to-end so the Maestro
# infrastructure exercises every Phase G route. First-run mode only:
# this flow does NOT bake in screenshots — D-VR adds the snapshot
# capture pass once the portfolio routes have stabilized.
#
# Coverage:
#   - Hero home tab
#   - Tokens index + 6 category screens (colors, typography, spacing,
#     radii, motion, shadows)
#   - Primitives index + a representative detail (planned + stable)
#   - Components showcase index + every existing showcase screen
#   - Layouts index + 5 placeholder routes
#   - Standards index
#
# Run locally:
#   maestro test apps/sample-native/.maestro/flows/portfolio-tour.yaml
#
# Run with screenshot capture (when D-VR adds it):
#   MAESTRO_SCREENSHOT=1 maestro test ... \
#     -e screenshotsDir=../screenshots/portfolio
appId: com.tiderman.genesis.sample
---
- launchApp:
    permissions:
      all: allow
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "portfolio-home"

# ──────────────────────────────────────────────────────────────────────
# Tokens (6 screens)
# ──────────────────────────────────────────────────────────────────────
- openLink: genesis-sample://tokens
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "tokens-index"

- openLink: genesis-sample://tokens/colors
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "tokens-colors"

- openLink: genesis-sample://tokens/typography
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "tokens-typography"

- openLink: genesis-sample://tokens/spacing
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "tokens-spacing"

- openLink: genesis-sample://tokens/radii
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "tokens-radii"

- openLink: genesis-sample://tokens/motion
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "tokens-motion"

- openLink: genesis-sample://tokens/shadows
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "tokens-shadows"

# ──────────────────────────────────────────────────────────────────────
# Primitives index + a planned detail
# ──────────────────────────────────────────────────────────────────────
- openLink: genesis-sample://primitives
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "primitive-toast"

- openLink: genesis-sample://primitives/toast
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "toast-default"

# ──────────────────────────────────────────────────────────────────────
# Components showcase
# ──────────────────────────────────────────────────────────────────────
