# Maestro flow: capture light-mode screenshots of every primitive
# rendered in apps/sample-native/app/components-showcase/.
#
# Run from repo root or from apps/sample-native:
#   maestro test apps/sample-native/.maestro/flows/screenshot-light.yaml
#
# Screenshots land in apps/sample-native/.maestro/screenshots/light/.
# CI diffs new captures against committed baselines; mismatch blocks merge.
#
# Light/dark/reduced-motion split: this flow assumes the simulator/device
# is in light mode. CI workflow toggles appearance per flow before running;
# locally, set the simulator appearance manually:
#   xcrun simctl ui booted appearance light    # iOS
#   adb shell "cmd uimode night no"            # Android
appId: com.tiderman.genesis.sample
---
- launchApp:
    permissions:
      all: allow
    arguments:
      # Stable seed so randomized content (if any) renders deterministically.
      MAESTRO_SCREENSHOT_MODE: "true"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/light/home

# Components Showcase — every primitive
- openLink: genesis-sample://components-showcase
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/light/showcase-index

- openLink: genesis-sample://components-showcase/buttons
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/light/buttons

- openLink: genesis-sample://components-showcase/cards
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/light/cards

- openLink: genesis-sample://components-showcase/inputs
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/light/inputs

- openLink: genesis-sample://components-showcase/badges
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/light/badges

- openLink: genesis-sample://components-showcase/dialogs
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/light/dialogs-closed
- tapOn:
    id: "dialog-open-trigger"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/light/dialogs-open
- tapOn:
    id: "dialog-cancel"

- openLink: genesis-sample://components-showcase/alerts
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/light/alerts

- openLink: genesis-sample://components-showcase/progress
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ../screenshots/light/progress
