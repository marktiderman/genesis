# PR preview: an installable build of each pull request, and an update on its own channel.
#
# 1. Fingerprint the native project as the preview variant builds it.
# 2. A preview build with that fingerprint exists: repack it with this pull request's JavaScript
#    (no native compile). None exists (the pull request changed native code): build one.
# 3. Publish the pull request's JavaScript as an update to the channel `pr-<number>`.
# 4. Comment on the pull request: the build's install link and QR code, and the update.
#
# When it runs (each run is up to two EAS builds or repacks, so the default is narrow):
# - A pull request into main that changes the app: its code folder or the config a build reads. A
#   docs-only pull request, or one into another branch, starts nothing.
#   The first path is the app's code folder. `genesis init --template native` fills in `src` (the
#   starter keeps its code there); in a copy made by hand, replace the placeholder: `src`, or
#   `apps/<name>` in a monorepo. An app with code in other top-level folders (`app/`,
#   `components/`) lists each. Until it's replaced only the config files start a run, and
#   `genesis doctor` warns about it (rule eas-placeholder).
# - Any pull request labeled `Preview` (create the label in GitHub), whatever it changes. A pull
#   request that also matches the paths can start two runs (one per trigger); `concurrency` keeps
#   one per branch, cancelling the older, and does the same when a new push supersedes a run.
# To widen it, add branches or paths; to run on every pull request, delete `branches` and `paths`.
#
# iOS is off until you turn it on. An iOS preview is an internal (ad hoc) build, which installs
# only on devices registered before it was built (`eas device:create`); with none registered,
# every iOS job fails. Register a device, then add the plain variable PREVIEW_IOS=true to the
# preview EAS environment. Android runs from the start. The gate reads PREVIEW_IOS through the
# `env` context of jobs that name the preview environment, as EAS's syntax describes; see
# docs/NATIVE-RELEASE.md, "Build cost", for what is verified. The fingerprint job hashes both
# platforms in one job and isn't gated.
#
# Nothing here can reach production: the preview profile and EAS environment, internal
# distribution, a pr-<number> channel, and no submit job. It does build the pull request's code
# with the preview environment's variables, so keep nothing there that production depends on.
# EAS doesn't run pull_request workflows for pull requests from forks.
#
# Genesis template (templates/eas/workflows/pr-preview.yml). Edit the copy in your app; see
# docs/NATIVE-RELEASE.md in the Genesis repository.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "REPLACE_WITH_APP_FOLDER/**"
      - "app.json"
      - "app.config.*"
      - "eas.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "package-lock.json"
      - "bun.lock"
      - "bun.lockb"
  pull_request_labeled:
    labels: [Preview]

# One run per branch: a newer run (a push, or the Preview label on a pull request that also
# matched the paths) cancels the one in progress.
concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: preview
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_APP_VARIANT: preview

  get_ios_build:
    name: Find a preview iOS build with this fingerprint
    needs: [fingerprint]
    if: ${{ env.PREVIEW_IOS == 'true' }}
    type: get-build
    environment: preview
    params:
      platform: ios
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  get_android_build:
    name: Find a preview Android build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  repack_ios:
    name: Repack iOS with this JavaScript
    needs: [get_ios_build]
    if: ${{ env.PREVIEW_IOS == 'true' && needs.get_ios_build.outputs.build_id }}
    type: repack
    environment: preview
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_APP_VARIANT: preview
    params:
      build_id: ${{ needs.get_ios_build.outputs.build_id }}
      profile: preview

  repack_android:
    name: Repack Android with this JavaScript
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: repack
    environment: preview
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_APP_VARIANT: preview
    params:
      build_id: ${{ needs.get_android_build.outputs.build_id }}
      profile: preview

  build_ios:
    name: Build iOS (native code changed)
    needs: [get_ios_build]
    if: ${{ env.PREVIEW_IOS == 'true' && !needs.get_ios_build.outputs.build_id }}
    type: build
    environment: preview
    params:
      platform: ios
      profile: preview

  build_android:
    name: Build Android (native code changed)
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    environment: preview
    params:
      platform: android
      profile: preview

  publish_update:
    name: Publish to channel pr-<number>
    needs: [fingerprint]
    type: update
    environment: preview
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_APP_VARIANT: preview
    params:
      channel: pr-${{ github.event.pull_request.number }}
      # Explicit: unset, EAS tries a Sentry source map upload whenever @sentry/react-native is
      # installed and only logs a failure. Set true once the Sentry plugin is on in app.config.ts
      # (with SENTRY_AUTH_TOKEN), so a failed upload fails the job.
      upload_sentry_sourcemaps: false

  comment:
    name: Comment on the pull request
    after: [repack_ios, repack_android, build_ios, build_android, publish_update]
    type: github-comment
    params:
      message: "Preview of this pull request: install a build from its link or QR code. A preview build already installed can switch to the channel pr-${{ github.event.pull_request.number }} instead."
