# Smoke: a `scheme://` link opens its screen in this build. Each APP_VARIANT registers its own scheme
# (withGenesis appends `-dev` / `-preview`), so the development variant answers to
# `genesis-starter-dev://`, and a production build installed beside it never takes the link.
#
#   MAESTRO_TEST_EMAIL=… MAESTRO_TEST_PASSWORD=… maestro test .maestro/flows/deep-link.yaml
#
# Change the scheme with `app.scheme` in starter.config.ts (and keep the `-dev`).
appId: com.example.genesisstarter.dev
tags:
  - smoke
  - account
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml
- openLink: "genesis-starter-dev://settings"
- extendedWaitUntil:
    visible:
      id: "settings"
    timeout: 10000
- assertVisible:
    id: "settings-row-version"
