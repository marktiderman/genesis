# Copy to .github/workflows/database.yml. genesis init, genesis add template and genesis upgrade
# write the Genesis release's commit in place of GENESIS_SHA; in a copy made by hand, replace it
# with the commit of the release you run (docs/APP-CI.md in marktiderman/genesis says how).
name: Database

on:
  pull_request:
    paths: ["supabase/**"]
  push:
    branches: [main]
    paths: ["supabase/**"]

permissions:
  contents: read

jobs:
  database:
    uses: marktiderman/genesis/.github/workflows/supabase-ci.yml@b322c78c21a5274e4ee2713794e95b306278e3de # @marktiderman/genesis@0.11.7
    with:
      package-manager: pnpm # or bun, npm
      doctor: false # app-ci's doctor already runs the supabase pack; true for a database-only repo
