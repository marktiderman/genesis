# Copy to .github/workflows/genesis-upgrade.yml. genesis init, genesis add template and genesis upgrade
# write the Genesis release's commit in place of GENESIS_SHA; in a copy made by hand, replace it
# with the commit of the release you run (docs/APP-CI.md in marktiderman/genesis says how).
name: Genesis upgrade

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    uses: marktiderman/genesis/.github/workflows/genesis-upgrade.yml@b322c78c21a5274e4ee2713794e95b306278e3de # @marktiderman/genesis@0.11.7
    with:
      package-manager: pnpm # or bun, npm
      # base-branch: staging # the branch the pull request targets; default: the default branch
    # So CI runs on the pull request (the default token can't start workflows):
    # secrets:
    #   token: ${{ secrets.GENESIS_UPGRADE_TOKEN }}
