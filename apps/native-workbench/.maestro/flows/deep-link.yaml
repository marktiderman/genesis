# Smoke: the development variant answers to its own scheme. A link to a section opens its tab.
appId: dev.genesis.workbench.dev
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "workbench-standards"
    timeout: 20000
- openLink: "genesis-workbench-dev://components"
# iOS asks before an app opens its own link from outside.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "workbench-components"
    timeout: 10000
