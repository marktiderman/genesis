# Standards: NativeListItem actions (fill and round) and NativeRowActions with a peek.
appId: dev.genesis.workbench.dev
tags:
  - workbench
  - standards
---
- runFlow: ../subflows/open-workbench.yaml
- tapOn:
    id: "workbench-open-row-actions-items"
- extendedWaitUntil:
    visible: "Round (iOS 26)"
    timeout: 15000
- longPressOn: "Round (iOS 26)"
- extendedWaitUntil:
    visible: "Hide Alerts"
    timeout: 5000
- takeScreenshot: row-actions-items-menu
- tapOn: "Hide Alerts"
- extendedWaitUntil:
    visible: "Ran alerts"
    timeout: 5000
- longPressOn: "With a peek"
- extendedWaitUntil:
    visible:
      id: "workbench-row-actions-items-peek"
    timeout: 5000
- takeScreenshot: row-actions-items-peek
