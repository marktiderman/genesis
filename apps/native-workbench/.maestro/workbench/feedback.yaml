# Components: banners, inline alerts, progress, skeletons, loading and empty states. Opens the screen from its tab and keeps a screenshot of it, before and after a scroll.
appId: com.streamlineddigital.genesis.showcase.dev
tags:
  - workbench
  - components
---
- runFlow: ../subflows/open-workbench.yaml
- tapOn: "Components"
- extendedWaitUntil:
    visible:
      id: "workbench-open-feedback"
    timeout: 10000
- tapOn:
    id: "workbench-open-feedback"
- extendedWaitUntil:
    visible:
      id: "workbench-feedback"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: feedback
- swipe:
    direction: UP
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: feedback-scrolled
