# Layouts: DetailPage: a sample invoice and its side column. Opens the screen from its tab and keeps a screenshot of it, before and after a scroll.
appId: com.streamlineddigital.genesis.dev
tags:
  - workbench
  - layouts
---
- runFlow: ../subflows/open-workbench.yaml
- tapOn: "Layouts"
- extendedWaitUntil:
    visible:
      id: "workbench-open-detail-page"
    timeout: 10000
- tapOn:
    id: "workbench-open-detail-page"
- extendedWaitUntil:
    visible:
      id: "workbench-detail-page"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: detail-page
- swipe:
    direction: UP
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: detail-page-scrolled
