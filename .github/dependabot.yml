# Dependency updates. Security updates are on in the repository settings; these are the
# routine ones, weekly and grouped so they arrive as a few reviewable PRs.
# `cooldown` waits a week after a release before proposing it, the same age rule the
# lockfile and Edge Function imports follow: a compromised release is usually pulled within days.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Leave package.json ranges alone while the new version still satisfies them: a minor or
    # patch bump only moves the lockfile, so published packages' ranges don't drift without a
    # changeset. A bump outside a range edits the manifest and needs one.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Genesis's own packages move through changesets, not Dependabot.
      - dependency-name: "@marktiderman/*"
      # The Expo starter's native packages move together with the Expo SDK (`expo install`).
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      # Also in the SDK's bundledNativeModules.json, at the version `expo install` picks: a bump
      # past it is a drift `genesis doctor` reports (`expo-native-deps`), so they move with the SDK.
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "@sentry/react-native"
      # react, react-dom and @types/react are pinned to the SDK's exact version in
      # pnpm-workspace.yaml (react-dom and React Native's renderer refuse a react of another
      # patch), so every bump, patches too, comes with the Expo SDK.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      # The starter is on NativeWind 4, which needs Tailwind 3; both majors move together, with
      # NativeWind 5. This entry covers the whole repo, so Tailwind majors for the web packages
      # (already on 4) are hand-made PRs too.
      - dependency-name: "nativewind"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # eslint's majors move with eslint-config-expo, which pins the eslint it supports.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # A peer of genesis-ui: apps install it, so its next major (new component names and props)
      # comes with a genesis-ui major, made by hand.
      - dependency-name: "react-resizable-panels"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the runtime's major (CI and engines are Node 22); move it with the Node upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    # Every action is pinned to a commit SHA with its version in a comment
    # (`uses: owner/action@<sha> # v1.2.3`); Dependabot moves both together.
    groups:
      actions:
        patterns: ["*"]
