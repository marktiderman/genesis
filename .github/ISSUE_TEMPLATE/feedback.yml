name: Feedback or bug
description: Something that works badly, or doesn't work, in a Genesis package.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: For a bug, what you expected and what you saw, with the package and version.
    validations:
      required: true
  - type: input
    id: feature
    attributes:
      label: Feature
      description: "The feature id from features.ts this is about, if you know it (`pnpm features find <term>`). Leave it empty and it will be triaged."
      placeholder: support-feedback
