# Claude on demand: mention @claude in a PR or issue comment, a review, or a
# new issue, and Claude answers, reviews or pushes a fix. Only people with
# write access can trigger it (the action checks).
#
# Needs the Claude GitHub app on the repo and the CLAUDE_CODE_OAUTH_TOKEN
# secret (`claude setup-token`). To change the model, edit --model below.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# Each job declares what it needs; nothing by default.
permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # ci.yml BILLING CONTRACT rule 3: every job is bounded.
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on a PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Detached at the event commit, so the action can create its own
          # local branch even when a PR head is also named main.
          ref: ${{ github.sha }}
          fetch-depth: 1

      - id: claude
        uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9 # v1.0.258
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model claude-opus-5-5
          additional_permissions: |
            actions: read

      # The action hides Claude's output; on failure, show only its final
      # message (e.g. an auth or model error), never the tool transcript.
      - name: Show Claude's error
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: jq -r '[.[] | select(.type == "result")] | last | .result // "No result message."' "$EXECUTION_FILE"
