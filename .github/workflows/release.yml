name: Release

on:
  push:
    branches: [main]
  # Re-run a publish without a new commit, e.g. after fixing a Trusted
  # Publisher on npmjs.com. With no pending changesets, changesets/action
  # publishes every local version not yet on npm, which is exactly the retry.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Each job asks for what it needs.
permissions: {}

jobs:
  release:
    name: Release
    # workflow_dispatch can target any ref; only main may version or publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The `npm` environment allows deployments from `main` ONLY (repo
    # Settings → Environments → npm → deployment branches: main). Every npm
    # Trusted Publisher is bound to environment `npm`, so npm issues a publish
    # token only to this job running on main. A branch that edits this file
    # cannot mint one: without the environment its OIDC token does not match,
    # and with it GitHub refuses the deployment.
    environment: npm
    # Publishing is I/O-bound and short; anything past this is a hang, not work.
    # ci.yml's BILLING CONTRACT rule 3 — the July 2026 runaways (118 and
    # 304-minute runs) had no timeout and ran to GitHub's 6-hour cap.
    timeout-minutes: 20
    # For the release-notes job below.
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
      pullRequestNumber: ${{ steps.changesets.outputs.pr-number }}
    permissions:
      # The version PR's branch and commit, and the package tags and GitHub releases, all
      # written through the GitHub API (changesets/action v2, scripts/create-tag-ref.sh).
      contents: write
      pull-requests: write
      # The npm Trusted Publishing token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git: changesets/action v2 writes the version commit and the
          # tags through the GitHub API with its github-token input, and so does
          # scripts/create-tag-ref.sh. So the token isn't left in .git/config while the install
          # and the build run dependency code.
          persist-credentials: false
          # changesets needs history to work out what to version.
          fetch-depth: 0
          # ...but not every blob ever committed. This workflow fires on EVERY
          # push to main, so its clone is the most-repeated cost in the repo —
          # blob:none is a partial clone: the full commit graph still arrives,
          # so changesets' version resolution and tag lookups are unchanged;
          # only file contents become lazy, and changesets reads the working
          # tree rather than history. Publishing behaviour is untouched.
          filter: blob:none

      # pnpm 11, not 9, and the reason is publishing.
      #
      # `pnpm publish` in pnpm 9 never attempts the npm OIDC token exchange at
      # all: it packs, then shells out to `npm publish --git-checks`, and npm
      # under that spawn does no exchange. MEASURED on run 34432136833 — every
      # package failed `npm error code ENEEDAUTH`, although `id-token: write`
      # is granted and npm 11.19.1 is installed.
      #
      # pnpm's own changelog records the matching 404 case at 11.1.2: "Fixed
      # `pnpm publish` failing with a 404 when authentication relied on OIDC
      # trusted publishing alongside an `.npmrc` written by `actions/setup-node`
      # (`_authToken=${NODE_AUTH_TOKEN}`) without `NODE_AUTH_TOKEN` being set"
      # (pnpm/pnpm#11513). That is exactly what run 34412522632 hit.
      #
      # The lockfile format version is unchanged across pnpm 9, 10 and 11, so
      # `--frozen-lockfile` reads the existing `pnpm-lock.yaml` (lockfileVersion
      # 9.0) without a regeneration.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0

      # node-version >=22 + npm >=11.5 enables OIDC Trusted Publishing
      # (no NPM_TOKEN secret needed; npm fetches a short-lived token via OIDC).
      # Trusted publisher must be configured at npmjs.com → @marktiderman → Trusted Publishers
      # pointing at this repo (marktiderman/genesis) + workflow file (release.yml).
      #
      # Node version pinned to 22.22.1: Node 22.22.2 ships a *broken* bundled
      # npm 10.9.7 whose @npmcli/arborist is missing the `promise-retry` dep
      # (MODULE_NOT_FOUND), making the bundled npm unusable for ANY install —
      # including `npm install -g npm@<x>` to upgrade out of the bad bundle.
      # 22.22.1 ships working npm 10.9.4. Bump deliberately when 22.22.3+ ships.
      #
      # DO NOT add `registry-url:` here. MEASURED on run 34412522632 attempt 2:
      # with `registry-url` set, setup-node writes
      # `/home/runner/work/_temp/.npmrc` holding
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and exports
      # `NODE_AUTH_TOKEN: XXXXX-XXXXX-XXXXX-XXXXX` — a literal placeholder,
      # because no NPM_TOKEN secret exists. npm reads that as "I already have
      # credentials", SKIPS the OIDC exchange, and publishes with the
      # placeholder. npm answers an unauthorised PUT on a scoped package with
      # 404, not 403, so every package failed as
      # `E404 Not Found - PUT https://registry.npmjs.org/@marktiderman%2f...`
      # even though the Trusted Publisher for @marktiderman/genesis-core is
      # correctly configured (marktiderman / genesis / release.yml).
      # With no `.npmrc` and no token, npm performs the OIDC exchange itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: pnpm

      # OIDC Trusted Publishing requires npm >= 11.5.1. The bundled npm in
      # Node 22.22.1 is 10.9.4, so we upgrade to 11.6.x explicitly.
      # Avoid 11.5.x — those tarballs are missing `promise-retry` from
      # arborist deps (same MODULE_NOT_FOUND issue, server-side this time).
      # 11.6.x: past the broken 11.5 window, satisfies the >= 11.5.1 OIDC
      # floor, caret keeps us inside 11.x — no surprise major bumps.
      - name: Ensure npm supports OIDC Trusted Publishing
        run: |
          npm install -g npm@^11.6.0
          npm --version

      # MEASURED on run 34435150697, from THIS workflow file, with a `curl`
      # call to `/-/npm/v1/oidc/token/exchange/package/<escaped name>`:
      #
      #   genesis-cli           -> 201  (npm issued a publish token)
      #   genesis-core          -> 404  OIDC token exchange error - package not found
      #   genesis-ui            -> 404  (same)
      #   genesis-design-system -> 404  (same)
      #   genesis-ui-native     -> 404  (same)
      #   genesis-switchboard   -> 404  (same)
      #   genesis               -> 404  (same)
      #
      # All seven packages exist on the registry; a plain GET returns 200 for
      # each. So the 404 is about AUTHORIZATION, not about the package.
      # `genesis-cli` proves the workflow, the permissions and the npm version
      # are all correct — it is the one package whose Trusted Publisher is bound
      # to THIS repo (see ROOT CAUSE below; the six DO have configs).
      #
      # ROOT CAUSE (found 2026-10-19): the six Trusted Publishers were bound
      # to a DIFFERENT repository. npm binds a trusted-publisher config to the
      # repo's immutable identity (repository_id) on its first successful
      # publish (docs.npmjs.com/trusted-publishers). The six configs
      # (genesis 052d6dfc, ui a3d79b99, core e584c918, design-system 0868e588,
      # switchboard e7323afd, ui-native b6d1c5f1) were validated by OIDC
      # publishes in July and on 2026-08-03/04 BEFORE 17:32Z, i.e. from an
      # earlier repo with the same name. This repo (id 1323213642) was created
      # 2026-08-04 17:32Z. Same owner/name/file, different repository_id, so
      # the exchange answers 404 "package not found", while `npm trust list`
      # shows nothing wrong (it does not print the bound repo id). genesis-cli
      # works because its config was re-created (331d2596 -> da090be5) and
      # first used from THIS repo (1.0.2, 2026-08-04 19:02Z).
      # 2026-10-19: genesis, ui and design-system were re-created and published
      # from this repo; then ALL packages were re-bound to environment `npm`
      # (see the `environment:` note on the job) and validated by one release.
      #
      # FIX: on npmjs.com (or `npm trust revoke` + `npm trust github ...
      # --env npm`), delete and re-create the package's Trusted Publisher,
      # then publish a new version from this workflow WITHIN 48 HOURS. Full
      # runbook: docs/RELEASING.md. An unused config expires
      # after 48h (GitHub changelog 2026-10-02). The first publish binds it to
      # this repo. If this repo is ever deleted and re-created, every package
      # needs the same treatment.
      #
      # pnpm 11 and npm 11.21 both attempt the exchange correctly
      # (`[WARN] Skipped OIDC: ... 404` / `npm verbose oidc Failed token
      # exchange`), then fall back to an UNAUTHENTICATED PUT, which npm answers
      # with E404. changesets swallows pnpm's warning, so all the log ever shows
      # is that E404. The "Verify npm Trusted Publishing" step below surfaces
      # the real cause before any PUT.
      #
      # The probe step that measured this is deleted. It printed the exchange
      # response body on any status other than 200, and a 201 body holds a
      # short-lived publish token, so the step leaked one into the run log.
      # The log for run 34435150697 was deleted for that reason.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "@marktiderman/*" build

      # THE 2.1.0 LESSON: @marktiderman/genesis-ui@2.1.0 and five siblings
      # published to npm on 2026-09-10 with a literal `"workspace:^"` /
      # `"workspace:*"` string in `dependencies`/`peerDependencies` — no
      # consumer can install that. `@changesets/cli` here (~2.30.0) already
      # auto-detects pnpm via `package-manager-detector` and correctly shells
      # to `pnpm publish` (proven locally: `pnpm --filter <pkg> pack` +
      # reading the tarball's package.json rewrites `workspace:^` to a real
      # semver range). But every non-genesis-cli package's CI publish failed
      # the OIDC Trusted Publisher exchange with 404 (see the comment above
      # "Ensure npm supports OIDC Trusted Publishing"), and there is no
      # `release.yml` run anywhere near the 2.1.0 publish timestamp — so it
      # was published by some path OUTSIDE this pipeline, almost certainly a
      # manual `npm publish`, which has no idea what `workspace:` means and
      # copies the raw string verbatim (measured: `npm pack` on
      # packages/ui leaves `workspace:^` untouched; `pnpm pack` rewrites it).
      #
      # This gate runs BEFORE any publish step, so a broken range fails the
      # job loud instead of reaching the registry. It packs every
      # publishable package for real and reads the packed package.json — the
      # exact same check that would have caught the 2.1.0 defect regardless
      # of which tool eventually does the actual publish (CI's own pnpm
      # path, or a human running something else by hand outside CI).
      # See scripts/verify-no-workspace-protocol.mjs for the full story.
      - name: "Guard against a workspace: protocol leaking into the packed output"
        run: node scripts/verify-no-workspace-protocol.mjs --skip-build

      # KEEP `pnpm changeset publish`, do NOT switch to a raw `pnpm publish`:
      # changesets/action v2 learns what was published from the NDJSON file
      # named by the CHANGESETS_OUTPUT environment variable it sets for the
      # publish script, and only `changeset publish` (CLI v3) writes that file.
      # A bare `pnpm publish -r` would write nothing, so `steps.changesets.
      # outputs.published` would go permanently false, and no package tags or
      # GitHub Releases would be created. `changeset publish` already resolves
      # to `pnpm publish` per-package here (see the block above); the guard
      # above is what actually protects the registry.
      # Fails loud, BEFORE any PUT, when npm will not trust this workflow for
      # a package about to be published. Without it, pnpm logs "Skipped OIDC"
      # (hidden by changesets), publishes unauthenticated, and the only
      # visible error is a misleading E404 (see the ROOT CAUSE note above).
      # Runs whenever a local version is missing from npm, with or without
      # pending changesets (see "Publish versions already on main" below for
      # why pending changesets no longer mean "nothing publishes"). Never
      # prints a token: an
      # exchange body is shown only for an error status, and the minted token
      # is discarded unused (it expires on its own).
      - name: Verify npm Trusted Publishing for packages about to publish
        id: verify
        run: |
          set -euo pipefail
          pending=()
          for pj in packages/*/package.json; do
            if [ "$(jq -r '.private // false' "$pj")" = true ]; then continue; fi
            nv=$(jq -r '"\(.name)@\(.version)"' "$pj")
            # Unpublished = empty stdout (version missing) or E404 (package
            # missing). Any other failure is not evidence either way: stop.
            # stderr is kept apart so an npm warning never reads as a version.
            if out=$(npm view "$nv" version 2>"$RUNNER_TEMP/view.err"); then
              if [ -z "$out" ]; then pending+=("${nv%@*}"); fi
            elif grep -q E404 "$RUNNER_TEMP/view.err"; then
              pending+=("${nv%@*}")
            else
              echo "::error::npm view $nv failed: $(head -c 300 "$RUNNER_TEMP/view.err")"; exit 1
            fi
          done
          if [ ${#pending[@]} -eq 0 ]; then echo "Nothing unpublished."; exit 0; fi
          echo "unpublished=true" >> "$GITHUB_OUTPUT"
          if ! idt=$(curl -sf --max-time 30 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value // empty'); then
            echo "::error::Could not get a GitHub OIDC token (is id-token: write granted?)"; exit 1
          fi
          if [ -z "$idt" ]; then echo "::error::GitHub returned no OIDC token value"; exit 1; fi
          echo "::add-mask::$idt"
          failed=0
          for name in "${pending[@]}"; do
            code=$(curl -s --max-time 30 -o "$RUNNER_TEMP/x.json" -w '%{http_code}' -X POST -H 'Content-Length: 0' \
              -H "Authorization: Bearer $idt" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name/\//%2f}") || code=000
            [[ "$code" =~ ^[0-9]{3}$ ]] || code=000
            # Only a COMPLETED non-2xx response is described, and only by its
            # parsed .message. A transfer error (000) may leave a partial body
            # that could hold a minted token, so it is never read.
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "OK    $name (npm trusts this workflow)"
            elif [ "$code" = 000 ]; then
              echo "::error::$name: OIDC token exchange request did not complete (network error or timeout). Re-run this workflow."
              failed=1
            else
              msg=$(jq -r '.message // empty' "$RUNNER_TEMP/x.json" 2>/dev/null | head -c 200) || msg=
              echo "::error::$name: npm refused the OIDC token exchange ($code ${msg:-no message}). Its Trusted Publisher is missing, bound to another repo, or expired: delete and re-create it on npmjs.com (repo marktiderman/genesis, workflow release.yml, environment npm), then re-run this workflow within 48h."
              failed=1
            fi
            rm -f "$RUNNER_TEMP/x.json"
          done
          exit $failed

      # MEASURED 2026-10-26: GitHub keeps one pending run per concurrency
      # group and cancels the older pending one when another push queues. A
      # version-PR merge followed within seconds by a feature merge therefore
      # lost its run (the version PR's merge commit, 0614901, was cancelled),
      # and the next run saw the feature's new changeset, so changesets/action
      # took the version path and never published. genesis-core 1.10.0 sat on
      # main unpublished. changesets/action only publishes when there are NO
      # pending changesets, so: when changesets ARE pending but main already
      # carries versions npm doesn't have, publish those first. `changeset
      # publish` publishes exactly the local versions missing from npm and
      # ignores pending changeset files. GitHub Releases are not created on
      # this path (only changesets/action does that); the package tags
      # `changeset publish` makes on HEAD are created on GitHub through the API
      # (scripts/create-tag-ref.sh says why not `git push`).
      - name: Publish versions already on main
        if: steps.verify.outputs.unpublished == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "No pending changesets: changesets/action publishes in the next step."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset publish
          sha=$(git rev-parse HEAD)
          for tag in $(git tag --points-at HEAD); do
            case "$tag" in release/*) continue ;; esac
            scripts/create-tag-ref.sh "$tag" "$sha"
          done

      - name: Create Release PR or Publish
        id: changesets
        # v2 (with Changesets CLI v3): pushes the version commit and the tags through
        # the GitHub API with `github-token` (default: this job's GITHUB_TOKEN).
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm changeset publish
          version-script: pnpm run version:packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          # NPM_TOKEN intentionally omitted — OIDC Trusted Publishing handles auth.
          # id-token: write above is for the OIDC publish token. npm still adds
          # an SLSA provenance attestation to trusted publishes, despite
          # publishConfig.provenance: false (see docs/RELEASING.md).


  # Release notes (genesis-product; docs/RELEASING.md, "Release notes"): what reached beta or live
  # in features.ts, for people. A job of its own, so it can never fail or slow the publish (the
  # release job is done and green before it starts), it holds no npm environment and no OIDC
  # token, and "Re-run failed jobs" redoes it with the release job's outputs. A re-run of
  # Release itself can't: with nothing left to publish, changesets reports published=false.
  release-notes:
    name: Release notes
    needs: release
    # Forks never tag or comment. !cancelled(): a publish that failed part-way still tags what shipped.
    if: >-
      !cancelled() && github.repository == 'marktiderman/genesis' &&
      (needs.release.outputs.published == 'true' ||
       (needs.release.outputs.hasChangesets == 'true' && needs.release.outputs.pullRequestNumber != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The release/* tag and its GitHub release.
      contents: write
      # The draft notes comment on the version PR.
      pull-requests: write
      # Closing, and commenting on, the idea issues a release answers.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release/* tag is created through the API, not pushed (scripts/create-tag-ref.sh),
          # and the public repository's lazy blob fetches need no token.
          persist-credentials: false
          # Every tag and commit: the notes diff from the previous release/* tag. Blob contents
          # stay lazy (catalogAt throws if one can't be fetched, never reads it as empty).
          fetch-depth: 0
          filter: blob:none

      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the product package
        run: pnpm --filter "@marktiderman/genesis-product..." build

      # While the version PR is open: the draft notes since the last release, as one comment on
      # that PR (found by its marker, edited in place). changesets rewrites the PR's body on every
      # push, so the notes can't live there.
      - name: Draft the release notes on the version PR
        if: needs.release.outputs.published != 'true'
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.release.outputs.pullRequestNumber }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Could not post the draft release notes on #$PR. The packages are untouched; re-run this job."' ERR
          prev=$(git describe --tags --match 'release/*' --abbrev=0 HEAD 2>/dev/null || git log --merges --grep 'chore: version packages' -n1 --format=%H HEAD)
          if [ -z "$prev" ]; then echo "::warning::No release/* tag and no version packages merge to diff from; no draft notes."; exit 0; fi
          # The H1 repeats what the comment says; the notes start at their sections.
          notes=$(pnpm exec genesis-product release --from "$prev" --name draft --repo "$GITHUB_REPOSITORY" | sed '1{/^# /d;}')
          marker='<!-- genesis-product:release-notes -->'
          body="$marker
          **Draft release notes**: the features that reached beta or live since \`$prev\`, from \`features.json\`. After the publish they become the GitHub release of this release's \`release/*\` tag, and the idea issues they answer are closed. Updated on every push to main.
          $notes"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | sed -n 1p)
          if [ -z "$id" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" --jq .html_url
          elif [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body)" = "$body" ]; then
            echo "Draft notes on #$PR unchanged."
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" --jq .html_url
          fi

      # After a publish: tag this commit release/<YYYY-MM-DD> in UTC (-2, -3 for a second release
      # that day), draft the notes since the previous release/* tag (the first time, since the last
      # version packages merge) and make them that tag's GitHub release. The tag is pushed even
      # when no feature changed, so the next release diffs from here; the GitHub release is made
      # only when there is something to say, and never marked latest over the package releases.
      # A re-run on a commit that already has its tag reuses it. The tag is created through the
      # GitHub API, not `git push`: a pushed tag is refused when its commits touch a workflow
      # file (run 40875804950; scripts/create-tag-ref.sh).
      - name: Tag the release and publish its notes
        id: product_release
        if: needs.release.outputs.published == 'true'
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'echo "::error::The packages are published, but the release tag or notes failed. Re-run this job, or follow docs/RELEASING.md (Release notes) by hand."' ERR
          prev=$(git describe --tags --match 'release/*' --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$prev" ]; then
            prev=$(git log --merges --grep 'chore: version packages' -n1 --format=%H HEAD^)
            echo "No earlier release/* tag: the notes start from the last version packages merge, $prev."
          fi
          if [ -z "$prev" ]; then echo "::error::Nothing to diff from: no release/* tag and no version packages merge."; exit 1; fi
          tag=$(git tag --points-at HEAD -l 'release/*' | sed -n 1p)
          if [ -z "$tag" ]; then
            base="release/$(date -u +%F)"; tag=$base; n=1
            while git rev-parse -q --verify "refs/tags/$tag" >/dev/null || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; do
              n=$((n + 1)); tag="$base-$n"
            done
            scripts/create-tag-ref.sh "$tag" "$(git rev-parse HEAD)"
          fi
          name=${tag#release/}
          pnpm exec genesis-product release --from "$prev" --name "$name" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md" 2> "$RUNNER_TEMP/notes.err"
          cat "$RUNNER_TEMP/notes.err" >&2
          # Without the issues the notes would publish without crediting who asked: stop, and re-run.
          if grep -q "Couldn't read the issues" "$RUNNER_TEMP/notes.err"; then
            echo "::error::Couldn't read the issues, so the notes for $tag aren't published yet. Re-run this job."; exit 1
          fi
          { echo "from=$prev"; echo "name=$name"; } >> "$GITHUB_OUTPUT"
          if ! grep -q '^## ' "$RUNNER_TEMP/notes.md"; then
            echo "No feature reached beta or live since $prev: $tag is tagged, with no GitHub release."; exit 0
          fi
          sed -i '1{/^# /d;}' "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" --verify-tag --latest=false --title "Release $name" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "Release notes for $tag (since $prev):"; cat "$RUNNER_TEMP/notes.md"

      # Close the loop only now that it shipped: close each open idea issue the release answers
      # and comment on it. Refuses more than 10 changed features (a wrong --from); then run it by
      # hand with --force (docs/RELEASING.md).
      - name: Close the ideas the release answers
        if: steps.product_release.outcome == 'success'
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ steps.product_release.outputs.from }}
          NAME: ${{ steps.product_release.outputs.name }}
        run: |
          set -euo pipefail
          trap 'echo "::error::The release is published, but closing its idea issues failed. See the log above, then re-run this job or run genesis-product release --notify --yes by hand."' ERR
          pnpm exec genesis-product release --from "$FROM" --name "$NAME" --repo "$GITHUB_REPOSITORY" --notify --yes > /dev/null
