name: Tarball Integrity

# THE 0.2.1 LESSON (fix c812291, "Build the umbrella in Release; republish
# 0.2.2"): the Release workflow's build filter matched every granular
# package but NOT the umbrella package itself, so `changeset publish`
# packed an UNBUILT umbrella — the 0.2.1 npm tarball shipped 2 files
# (package.json + README), no dist/, no types. Nothing caught it before
# publish. See scripts/verify-tarball-integrity.mjs for the full story.
#
# This gate builds the whole publishable set, then asserts each in-scope
# package's `npm pack --dry-run` tarball actually contains dist/ + a .d.ts, so a
# repeat of 0.2.1 fails LOUD in CI instead of shipping silently.
#
# Runs on every PR into main, staging/** and prestage/**, because "npm pack
# dist/+types check" is a required check: a `paths` filter on the trigger would
# leave it unreported (and the PR unmergeable) on a PR that touches none of the
# paths. Instead, the first step decides whether the checks below apply, and the
# job always finishes under the same name, passing at once when they don't.
# They apply to:
#   - any PR touching packages/**, release machinery, or this gate itself
#     (fast path: the script builds the whole publishable set, then packs
#     only the packages that changed — see verify-tarball-integrity.mjs's
#     diff-based targeting).
#   - any PR whose head is a changeset-release/* branch (the auto-generated
#     "chore: version packages" PR that changesets/action opens against
#     main) — that is the EXACT PR shape that published the broken 0.2.1
#     tarball, so it always gets the full --all check below, whatever files
#     it touches.
#   - a manual run (workflow_dispatch), always.

on:
  pull_request:
    branches: [main, "staging/**", "prestage/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarball-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tarball-integrity:
    name: npm pack dist/+types check
    runs-on: ubuntu-latest
    # ci.yml BILLING CONTRACT rule 3: an unbounded job runs to GitHub's
    # 6-hour cap. Two July 2026 runaways did exactly that.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pushes nothing; the public repo fetches without a token.
          persist-credentials: false
          # Full history: the script diffs HEAD against the PR base ref to
          # target only the packages that changed (fast path).
          fetch-depth: 0
          # Commit graph only — see the same note in genesis-lint.yml. blob:none
          # keeps the graph, so the base-ref diff that picks which packages to
          # pack is unchanged; only file contents become lazy.
          #
          # verify-tarball-integrity.mjs passes --no-renames so that diff needs
          # no blobs at all; rename detection would otherwise read blob contents
          # and lazily backfill them. Keep the two in step.
          filter: blob:none

      # The paths the trigger's `paths` filter used to list. HEAD is the PR's
      # merge commit, so HEAD^1 is the base tip and this lists the PR's own
      # changes. --no-renames needs trees only, no blobs (see blob:none above).
      - name: Does this PR touch packages or release machinery?
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Manual run: checking." ; echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$HEAD_REF" in
            changeset-release/*) echo "changeset-release/* head: checking." ; echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          pattern='^(packages/|\.changeset/)|^(\.github/workflows/release\.yml|\.github/workflows/tarball-integrity\.yml|scripts/verify-tarball-integrity\.mjs|scripts/verify-no-workspace-protocol\.mjs|pnpm-workspace\.yaml|pnpm-lock\.yaml|package\.json)$'
          if matched=$(grep -E "$pattern" <<< "$files"); then
            echo "Relevant changes:"; echo "$matched"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "No packages, release machinery or lockfile changes: nothing to pack. Passing."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changes.outputs.relevant == 'true'
        with:
          version: 11.26.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify tarball integrity
        if: steps.changes.outputs.relevant == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_REF"

          # The changesets version-packages PR ALWAYS gets the full --all
          # check — it is the exact PR shape that published 0.2.1, so
          # never let its scope be narrowed by the diff-based fast path.
          case "$HEAD_REF" in
            changeset-release/*)
              echo "changeset-release/* head — checking ALL publishable packages."
              node scripts/verify-tarball-integrity.mjs --all
              ;;
            *)
              node scripts/verify-tarball-integrity.mjs --base "origin/$BASE_REF"
              ;;
          esac

      # THE 2.1.0 LESSON (see scripts/verify-no-workspace-protocol.mjs):
      # a published `workspace:` range is invisible to the check above — it
      # only asserts a tarball HAS dist/ + types, not that its package.json
      # is installable. This runs on every PR this workflow already covers
      # (always full-package, no fast path — a broken range on any package
      # is worth the extra minute), so a changeset-release/* PR fails here
      # before anyone can merge it, on top of the release.yml gate that
      # covers a direct push to main. No --skip-build: the step above may
      # have taken its own fast path and skipped building entirely when no
      # publishable package's source changed, and dist/ is gitignored, so
      # this has to build for itself rather than assume dist/ exists.
      - name: "Verify no workspace: protocol in packed output"
        if: steps.changes.outputs.relevant == 'true'
        run: node scripts/verify-no-workspace-protocol.mjs
