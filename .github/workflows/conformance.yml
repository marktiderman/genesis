name: Conformance

# The responsive and accessibility conformance run (docs/RESPONSIVE.md, rule 10): the built sample
# app and every Storybook story in Chromium, WebKit and Firefox, at 320–1440px and at 200% and 400%
# zoom, with touch on phones and tablets. It fails on sideways scroll (WCAG 1.4.10), axe WCAG 2.2
# A/AA violations (target-size included), hit areas under 44px on touch, focus hidden under a fixed
# bar (2.4.11), more than one floating control on a phone, and a viewport meta missing its parts.
# Known findings live in apps/sample/conformance/allow.json and only shrink.
#
# Pull requests run the per-PR scope (one page per route pattern; stories in Chromium and WebKit at
# 320, 768 and 1280). Pushes to main, the nightly schedule and a manual run cover everything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "staging/**", "prestage/**"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFORMANCE_SCOPE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}

jobs:
  build:
    name: Conformance build
    # Skip only the trusted Version Packages PR; a fork branch of the same name always runs.
    if: github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.26.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter sample build
      - run: pnpm --filter sample build-storybook
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-build
          path: |
            apps/sample/build/client
            apps/sample/storybook-static
            packages/genesis-cli/dist
          retention-days: 3

  shard:
    name: Conformance shard ${{ matrix.shard }}/4
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.26.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-build
      - name: Playwright version
        id: pw
        working-directory: apps/sample
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-all
      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/sample
        run: pnpm exec playwright install --with-deps chromium webkit firefox
      - name: Install browser OS libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: apps/sample
        run: pnpm exec playwright install-deps chromium webkit firefox
      - name: Run the conformance checks
        env:
          CONFORMANCE_SHARD: ${{ matrix.shard }}
        run: pnpm --filter sample conformance --shard=${{ matrix.shard }}/4
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-blob-${{ matrix.shard }}
          path: apps/sample/blob-report
          retention-days: 7
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-findings-${{ matrix.shard }}
          path: apps/sample/test-results/conformance-findings.jsonl
          if-no-files-found: ignore
          retention-days: 7

  report:
    # The one check to require: green only when every shard is.
    name: Conformance
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    needs: [build, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.26.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conformance-blob-*
          path: apps/sample/all-blob-reports
          merge-multiple: true
      - name: Merge the shard reports
        working-directory: apps/sample
        run: pnpm exec playwright merge-reports --reporter html,github ./all-blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: apps/sample/playwright-report
          retention-days: 14
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.CONFORMANCE_SCOPE == 'full'
        with:
          pattern: conformance-findings-*
          path: apps/sample/all-findings
      # A full run fails on an allow entry that covered nothing, so the list only shrinks.
      - name: No stale allow entries
        if: env.CONFORMANCE_SCOPE == 'full' && needs.shard.result == 'success'
        working-directory: apps/sample
        run: pnpm exec tsx conformance/teardown.ts all-findings/*/conformance-findings.jsonl
      - name: Every shard passed
        if: needs.build.result != 'success' || needs.shard.result != 'success'
        run: |
          echo "Conformance failed: build=${{ needs.build.result }}, shards=${{ needs.shard.result }}. The HTML report is the conformance-report artifact."
          exit 1
