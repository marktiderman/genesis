# Product board: rewrites the board issue (labelled product-board, opened by this workflow) from
# features.json and the open idea and feedback issues (genesis-product board --issue), once a day
# and on demand, so the board is one link away on any device. Reads features.json as committed;
# nothing is pushed. Scheduled and manual runs use the default branch, so it starts once on main.

name: Product board

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-board
  # A second run waits rather than cutting a write in half.
  cancel-in-progress: false

jobs:
  board:
    # Forks that turn on Actions don't open boards of their own.
    if: github.repository == 'marktiderman/genesis'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # The token isn't left in .git/config while dependencies' install scripts run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the product package
        run: pnpm --filter "@marktiderman/genesis-product..." build

      - name: Write the board issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm product board --issue --repo "$GITHUB_REPOSITORY"
