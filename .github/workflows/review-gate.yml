# The "Adversarial review" check: runs on every pull request into a staging batch
# (`staging/**`) and into the default branch (the batch's release PR included), so no pull request
# merges (auto-merge included) until an independent reviewer has reviewed its latest commit.
#
# The reviewer (triage: a session that didn't write the code) runs the adversarial review, posts
# a formal review of the head commit with the verdict and findings, and when every finding (lows
# included) is fixed, or declined with a reason the reviewer accepts, adds the label
# `review: approved`. The check passes only with both: the label, and a review of the current head
# SHA that approves (an APPROVED review, or, since GitHub refuses an approval from the PR author's
# own account, a comment review whose body starts "Verdict: approve", in any case). Any new commit,
# a merge of the base included, takes the label off, and a review of an older head never counts,
# so a stale label can't pass an unreviewed head. Both the label and the review count only from a
# person's account, never an app's or a bot's.
name: Adversarial review

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, edited]
    branches: ['staging/**', 'main']
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Adversarial review
    # A review event can't filter by base branch, so the job does: only PRs into a batch or into
    # the default branch.
    if: startsWith(github.event.pull_request.base.ref, 'staging/') || github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: A new commit needs a new review
        if: "${{ github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'review: approved') }}"
        run: |
          gh pr edit "$PR" --repo "$REPO" --remove-label "review: approved"
          gh pr comment "$PR" --repo "$REPO" --body "New commits since the review: \`review: approved\` is removed until the latest head is reviewed."
          echo "::error::New commits since the review. Review the latest head, then label the PR 'review: approved'."
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
      - name: Reviewed?
        if: "${{ !(github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'review: approved')) }}"
        run: |
          # Read the label now, not from the event, so a label a failed revoke left behind or one
          # added since still counts as it stands.
          if ! gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -Fxq 'review: approved'; then
            echo "::error::Waiting for an independent adversarial review. The reviewer adds 'review: approved' once every finding (lows included) is fixed, or declined with a reason the reviewer accepts."
            exit 1
          fi
          # The label and the approving review count only from a person's account: an app or bot
          # token can add a label and post a "Verdict: approve" comment, and neither passes here.
          labeler=$(gh api --paginate "repos/$REPO/issues/$PR/events" \
            --jq '.[] | select(.event == "labeled" and .label.name == "review: approved") | .actor.type' | tail -n 1)
          if [ "$labeler" != "User" ]; then
            echo "::error::'review: approved' was added by an app or bot ($labeler), not a reviewer. A reviewer adds it from their own account."
            exit 1
          fi
          approvals=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq "[.[] | select(.commit_id == \"$HEAD\") | select(.user.type == \"User\") | select(.state == \"APPROVED\" or ((.body // \"\") | ascii_downcase | startswith(\"verdict: approve\")))] | length" \
            | awk '{s += $1} END {print s + 0}')
          if [ "$approvals" -eq 0 ]; then
            echo "::error::'review: approved' is on, but no review of the head ($HEAD) approves it. Review the latest head."
            exit 1
          fi
          echo "Reviewed: $approvals approving review(s) of $HEAD, and 'review: approved'."
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha }}
