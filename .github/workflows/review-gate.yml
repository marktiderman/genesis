# The "Adversarial review" check, required on every pull request into a staging batch
# (`staging/**`) and into the default branch (the batch's release PR included): no pull request
# merges (auto-merge included) until an independent reviewer has reviewed its latest commit.
#
# The reviewer (triage: a session that didn't write the code) runs the adversarial review, posts
# a formal review of the head commit with the verdict and findings, and when every finding (lows
# included) is fixed, or declined with a reason the reviewer accepts, adds the label
# `review: approved`. Adding the label is what runs this check, so the review comes first. The
# check passes only with both: the label, and an approving latest verdict on the current head SHA
# (an APPROVED review, or, since GitHub refuses an approval from the PR author's own account, a
# comment review whose body starts "Verdict: approve", in any case). A later "Verdict: changes
# requested" (or CHANGES_REQUESTED) on the same head overrides an earlier approve, and a dismissed
# review never counts. Any new commit, a merge of the base included, takes the label off, and a
# review of an older head never counts, so a stale label can't pass an unreviewed head.
#
# Both the label and the review count only from a person's account, never an app's or a bot's.
# That filter doesn't tell the reviewer from the author: every agent acts as the account that
# opened the PR, so keeping the reviewer apart from the author is process ("Never approve or
# label your own PR").
#
# It runs on `pull_request_target`, so the copy of this file that judges a PR is always the base
# branch's: a PR can't rewrite its own gate. It checks nothing out and runs no PR code; it only
# reads the PR through the API. Its check run lands on the PR's head SHA. A push made with
# Actions' `GITHUB_TOKEN` (a release bot's, say) starts no run: the reviewer reviews the new head,
# then removes and re-adds the label. To re-run it after a changed verdict, the reviewer removes
# the label.
# Add and remove the label with the REST API, e.g.
# `gh api -X POST repos/<owner>/<repo>/issues/<n>/labels -f "labels[]=review: approved"`:
# `gh pr edit` can fail on GitHub's deprecated Projects (classic) field.
name: Adversarial review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, edited]
    branches: ['staging/**', 'main']

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Adversarial review
    runs-on: ubuntu-latest
    steps:
      # No job-level `if`: a skipped job would satisfy a required check. A base that isn't gated
      # fails here instead (no ruleset requires the check there, so that red run is harmless).
      - name: Gated base?
        shell: bash
        run: |
          case "$BASE" in
            staging/*|"$DEFAULT") echo "Gated base: $BASE" ;;
            *) echo "::error::'$BASE' isn't a staging batch or the default branch, so this gate doesn't apply."; exit 1 ;;
          esac
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
      - name: A new commit needs a new review
        if: "${{ github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'review: approved') }}"
        shell: bash
        run: |
          # The token is the base branch's, with write access, Dependabot's and forks' PRs included.
          # If the revoke still fails, the label stays, but a review of an older head never counts.
          # REST, not `gh pr edit` or `gh pr comment`: their GraphQL queries can fail on GitHub's
          # deprecated Projects (classic) field. A 404 means the label is already off.
          if ! out=$(gh api -X DELETE "repos/$REPO/issues/$PR/labels/review:%20approved" 2>&1); then
            case "$out" in
              *"HTTP 404"*) echo "'review: approved' was already off." ;;
              *) echo "::warning::Couldn't remove 'review: approved' ($out). It no longer counts: the new head needs its own review." ;;
            esac
          fi
          gh api "repos/$REPO/issues/$PR/comments" \
            -f body="New commits since the review: \`review: approved\` is removed until the latest head is reviewed." >/dev/null || true
          echo "::error::New commits since the review. Review the latest head, then label the PR 'review: approved'."
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
      - name: Reviewed?
        if: "${{ !(github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'review: approved')) }}"
        # `shell: bash` runs with -eo pipefail: a failed API call (any page) fails the step, so an
        # incomplete review history can never pass.
        shell: bash
        run: |
          # Read the label now, not from the event, so a label a failed revoke left behind or one
          # added since still counts as it stands.
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          if ! grep -Fxq 'review: approved' <<< "$labels"; then
            echo "::error::Waiting for an independent adversarial review. The reviewer adds 'review: approved' once every finding (lows included) is fixed, or declined with a reason the reviewer accepts."
            exit 1
          fi
          # An app or bot token can add a label and post a "Verdict: approve" comment; neither
          # passes here.
          labeler=$(gh api --paginate "repos/$REPO/issues/$PR/events" \
            --jq '.[] | select(.event == "labeled" and .label.name == "review: approved") | .actor.type' | tail -n 1)
          if [ "$labeler" != "User" ]; then
            echo "::error::'review: approved' was added by an app or bot ($labeler), not a reviewer. A reviewer adds it from their own account."
            exit 1
          fi
          # The latest verdict on the head from a person decides: dismissed reviews are ignored,
          # and a later "changes requested" overrides an earlier approve. A review's verdict is
          # read from its first non-empty line, lowercased, with every * _ ` removed and leading
          # # > and whitespace stripped, then matched as "verdict: approve" or
          # "verdict: changes requested". A line that starts "verdict" but parses to neither
          # counts as not approving. Each review becomes a "time<TAB>verdict" line; the latest wins.
          VERDICT_JQ=$(cat <<'JQ'
          .[]
          | select(.commit_id == $head and .user.type == "User" and .state != "DISMISSED")
          | ((.body // "") | ascii_downcase | split("\n") | map(select(test("\\S"))) | (.[0] // "")
             | gsub("[*_`]"; "") | sub("^[\\s#>]+"; "")) as $line
          | ([$line | capture("^verdict\\s*:\\s*(?<v>approve|changes requested)")] | .[0].v) as $parsed
          | (if .state == "CHANGES_REQUESTED" then "changes"
             elif $parsed == "approve" then "approve"
             elif $parsed == "changes requested" then "changes"
             elif ($line | startswith("verdict")) then "unreadable"
             elif .state == "APPROVED" then "approve"
             else empty end) as $v
          | "\(.submitted_at)\t\($v)"
          JQ
          )
          reviews=$(mktemp)
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" > "$reviews"
          verdict=$(jq -r --arg head "$HEAD" "$VERDICT_JQ" "$reviews" | sort | tail -n 1 | cut -f 2)
          if [ "$verdict" != "approve" ]; then
            echo "::error::'review: approved' is on, but the latest verdict on the head ($HEAD) is '${verdict:-none}', not an approve. Review the latest head."
            exit 1
          fi
          echo "Reviewed: the latest verdict on $HEAD approves, and 'review: approved' is on."
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha }}
