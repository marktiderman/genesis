# Claude reviews every pull request once, whatever branch it targets (main,
# staging/* and prestage/* batches alike), when it opens or leaves draft, with
# Anthropic's code-review plugin (parallel reviewers, findings posted as a PR
# comment). For another pass after new pushes, comment "@claude review"
# (claude.yml). Reviewing every push would bill a full review per push.
#
# Needs the Claude GitHub app on the repo and the CLAUDE_CODE_OAUTH_TOKEN
# secret (`claude setup-token`). To change the model, edit --model below.
name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each job declares what it needs; nothing by default.
permissions: {}

jobs:
  review:
    # Drafts wait for ready_for_review; forks can't read the secret; bot PRs
    # (the changesets version PR, Dependabot) aren't reviewed.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    # ci.yml BILLING CONTRACT rule 3: every job is bounded.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # A review pushes nothing; the action brings its own token.
          persist-credentials: false

      - id: claude
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # The tools the code-review command declares, so it can read the PR
          # and post findings.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"

      # The action hides Claude's output; on failure, show only its final
      # message (e.g. an auth or model error), never the tool transcript.
      - name: Show Claude's error
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: jq -r '[.[] | select(.type == "result")] | last | .result // "No result message."' "$EXECUTION_FILE"
