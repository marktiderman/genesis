# Claude reviews every pull request, whatever branch it targets (main,
# staging/* and prestage/* batches alike), when it opens, leaves draft, and on
# every push, so the latest head is always reviewed. A newer push cancels a
# review still running. "@claude review" (claude.yml) asks for one by hand.
# The review itself is the reusable claude-review.yml, the same one Genesis apps call.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/claude-review.yml
    secrets: inherit
