# Genesis upgrade (reusable): moves every @marktiderman/genesis* dependency to
# one Genesis release, reinstalls, runs `genesis doctor` and opens (or updates)
# one pull request.
#
# The schedule lives in the caller (templates/ci/genesis-upgrade.yml is a ready copy):
#
#   on:
#     schedule:
#       - cron: "0 6 * * 1"
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     upgrade:
#       uses: marktiderman/genesis/.github/workflows/genesis-upgrade.yml@<commit sha> # @marktiderman/genesis@<version>
#       with:
#         package-manager: pnpm
#
# How versions are chosen: the umbrella @marktiderman/genesis publishes
# dist/versions.json, the exact version of every package it was released with
# (the same manifest `genesis doctor`'s version-skew rule reads). Packages in it
# move to that version, the umbrella to the release itself, and Genesis packages
# the umbrella doesn't list (the CLI, studio, supabase) to their npm `latest`.
# The range prefix (^, ~ or exact) is kept; workspace:, file:, link:, npm:
# aliases and other ranges are left alone, and nothing is downgraded.
#
# Two jobs, so the job that holds a write token never runs dependency code:
# `bump` (read-only) edits package.json, installs (install scripts run here)
# and runs the doctor, then hands over a patch; `pr` checks that the patch only
# touches package.json files and lockfiles, commits it and opens the pull request.
#
# A pull request opened with the default GITHUB_TOKEN does not start other
# workflows, so CI won't run on it until someone pushes. Pass a `token` secret
# (a fine-grained token or a GitHub App token with contents and pull requests
# write) to have CI run on it. With the default token, the repository must allow
# GitHub Actions to create pull requests (Settings > Actions > General).

name: Genesis upgrade (reusable)

on:
  workflow_call:
    inputs:
      package-manager:
        description: "pnpm, bun or npm"
        type: string
        default: pnpm
      package-manager-version:
        description: "pnpm or bun version. Empty: from package.json packageManager (bun: then engines.bun, then latest). Ignored for npm."
        type: string
        default: ""
      working-directory:
        description: "Folder whose package.json files are upgraded (every tracked one at or below it), relative to the repository root"
        type: string
        default: "."
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      version:
        description: "The @marktiderman/genesis release to move to: an exact version or an npm dist-tag"
        type: string
        default: latest
      branch:
        description: "Branch the upgrade is pushed to (rebuilt from the base branch on every run)"
        type: string
        default: genesis-upgrade
      doctor:
        description: "Run genesis doctor after the install; a failure is reported on the pull request and fails the run"
        type: boolean
        default: true
      dry-run:
        description: "Bump, install and run the doctor, write the run summary, and push nothing"
        type: boolean
        default: false
      timeout-minutes:
        description: "Timeout for each job"
        type: number
        default: 20
    secrets:
      token:
        description: "Optional token for the push and the pull request, so the pull request's own CI runs. Default: GITHUB_TOKEN."
        required: false
    outputs:
      version:
        description: "The @marktiderman/genesis version the run upgraded to"
        value: ${{ jobs.bump.outputs.version }}
      changed:
        description: "true when there was something to upgrade"
        value: ${{ jobs.bump.outputs.changed }}

jobs:
  bump:
    name: Bump Genesis packages
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      changed: ${{ steps.patch.outputs.changed }}
      doctor: ${{ steps.doctor.outcome }}
    steps:
      - name: Check the trigger
        env:
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request_target" ] || [ "$REF_TYPE" != "branch" ]; then
            echo "::error title=genesis-upgrade::Run genesis-upgrade on a branch (schedule or workflow_dispatch); the pull request targets that branch."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the app and its lockfile
        id: app
        env:
          PM: ${{ inputs.package-manager }}
          WD: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=genesis-upgrade::$1"; exit 1; }
          case "$PM" in
            pnpm) locks="pnpm-lock.yaml" ;;
            bun) locks="bun.lock bun.lockb" ;;
            npm) locks="package-lock.json npm-shrinkwrap.json" ;;
            *) fail "package-manager must be pnpm, bun or npm, not '$PM'" ;;
          esac
          ws=$(pwd -P)
          app=$(cd -- "$WD" 2>/dev/null && pwd -P) || fail "working-directory '$WD' does not exist"
          case "$app/" in "$ws"/*) ;; *) fail "working-directory '$WD' is outside the repository" ;; esac
          [ -f "$app/package.json" ] || fail "working-directory '$WD' has no package.json"
          dir=$app
          lockfile=''
          while :; do
            for l in $locks; do
              if [ -f "$dir/$l" ]; then lockfile=$dir/$l; break 2; fi
            done
            [ "$dir" = "$ws" ] && break
            dir=$(dirname -- "$dir")
          done
          [ -n "$lockfile" ] || fail "no $PM lockfile ($locks) in '$WD' or a folder above it"
          rel() { local p=${1#"$ws"}; p=${p#/}; echo "${p:-.}"; }
          echo "root=$(rel "$(dirname -- "$lockfile")")" >> "$GITHUB_OUTPUT"
          echo "lockfile=$(rel "$lockfile")" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ inputs.package-manager-version }}
          package_json_file: ${{ steps.app.outputs.root }}/package.json

      - name: Set up Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.package-manager-version }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Bump @marktiderman/genesis* to one release
        id: bump
        working-directory: ${{ inputs.working-directory }}
        env:
          TARGET: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/genesis-upgrade"
          git ls-files -z -- ':(glob)**/package.json' > "$RUNNER_TEMP/genesis-upgrade/candidates"
          node --input-type=module - <<'JS'
          import { execFileSync } from "node:child_process";
          import { appendFileSync, mkdtempSync, readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";

          const env = process.env;
          const out = path.join(env.RUNNER_TEMP, "genesis-upgrade");
          const fail = (msg) => { console.log(`::error title=genesis-upgrade::${msg}`); process.exit(1); };
          const npm = (args) => execFileSync("npm", args, { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"] }).trim();
          const UMBRELLA = "@marktiderman/genesis";
          const GENESIS = /^@marktiderman\/genesis(-[a-z0-9-]+)?$/;
          const EXACT = /^(\^|~|=)?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/;
          const SECTIONS = ["dependencies", "devDependencies", "optionalDependencies"];

          // The release: an exact version or a dist-tag, never a range.
          const target = env.TARGET || "latest";
          if (!/^[0-9A-Za-z][0-9A-Za-z.+-]*$/.test(target)) fail(`version must be an exact version or a dist-tag, not "${target}"`);
          const version = JSON.parse(npm(["view", `${UMBRELLA}@${target}`, "version", "--json"]) || "null");
          if (typeof version !== "string") fail(`${UMBRELLA}@${target} is not one published version`);

          // Its manifest, from the published tarball.
          const tmp = mkdtempSync(path.join(env.RUNNER_TEMP, "genesis-umbrella-"));
          const [packed] = JSON.parse(npm(["pack", `${UMBRELLA}@${version}`, "--pack-destination", tmp, "--json"]));
          execFileSync("tar", ["-xzf", path.join(tmp, packed.filename), "-C", tmp, "package/dist/versions.json"]);
          const manifest = JSON.parse(readFileSync(path.join(tmp, "package/dist/versions.json"), "utf8"));
          if (manifest.version !== version) fail(`${UMBRELLA}@${version} ships a versions.json for ${manifest.version}`);
          const pinned = { [UMBRELLA]: version, ...manifest.packages };

          const latest = new Map();
          const wanted = (name) => {
            if (name in pinned) return pinned[name];
            if (!latest.has(name)) {
              let v = null;
              try { v = JSON.parse(npm(["view", `${name}@latest`, "version", "--json"]) || "null"); } catch {}
              latest.set(name, typeof v === "string" ? v : null);
            }
            return latest.get(name);
          };
          const parse = (v) => v.split("-")[0].split(".").map(Number);
          const compare = (a, b) => {
            const [x, y] = [parse(a), parse(b)];
            for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i];
            return (a.includes("-") ? 0 : 1) - (b.includes("-") ? 0 : 1);
          };

          const changes = [], skipped = [], files = [];
          const candidates = readFileSync(path.join(out, "candidates"), "utf8").split("\0").filter(Boolean);
          for (const file of candidates) {
            const text = readFileSync(file, "utf8");
            const pkg = JSON.parse(text);
            let touched = false;
            for (const section of SECTIONS) {
              for (const [name, spec] of Object.entries(pkg[section] ?? {})) {
                if (!GENESIS.test(name)) continue;
                const m = EXACT.exec(spec);
                if (!m) { skipped.push({ file, name, spec, why: "not a plain version" }); continue; }
                const want = wanted(name);
                if (!want) { skipped.push({ file, name, spec, why: "no latest version on npm" }); continue; }
                const cmp = compare(want, m[2]);
                if (cmp === 0) continue;
                if (cmp < 0) { skipped.push({ file, name, spec, why: `newer than ${want}` }); continue; }
                pkg[section][name] = `${m[1] ?? ""}${want}`;
                changes.push({ file, name, from: spec, to: pkg[section][name] });
                touched = true;
              }
            }
            if (touched) {
              const indent = /^[ \t]+(?=")/m.exec(text)?.[0] ?? "  ";
              writeFileSync(file, JSON.stringify(pkg, null, indent) + (text.endsWith("\n") ? "\n" : ""));
              files.push(path.relative(env.GITHUB_WORKSPACE, path.resolve(file)));
            }
          }

          writeFileSync(path.join(out, "files"), files.join("\n"));
          const row = (c) => `| \`${c.name}\` | ${c.from} | ${c.to} | ${c.file} |`;
          const body = [
            `Moves every Genesis package to the **${UMBRELLA}@${version}** release: the versions in its \`versions.json\`, and npm \`latest\` for packages it doesn't list.`,
            "",
            changes.length ? ["| Package | From | To | File |", "| --- | --- | --- | --- |", ...changes.map(row)].join("\n") : "Nothing to change.",
            ...(skipped.length ? ["", "Left alone:", "", ...skipped.map((s) => `- \`${s.name}\` ${s.spec} in ${s.file}: ${s.why}`)] : []),
          ].join("\n");
          writeFileSync(path.join(out, "changes.md"), body + "\n");
          appendFileSync(env.GITHUB_STEP_SUMMARY, body + "\n");
          appendFileSync(env.GITHUB_OUTPUT, `version=${version}\ncount=${changes.length}\n`);
          console.log(body);
          JS

      - name: Install (updates the lockfile)
        if: steps.bump.outputs.count != '0'
        working-directory: ${{ steps.app.outputs.root }}
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) pnpm install --no-frozen-lockfile ;;
            bun) bun install ;;
            npm) npm install ;;
          esac

      - name: genesis doctor
        id: doctor
        if: steps.bump.outputs.count != '0' && inputs.doctor
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -uo pipefail
          bin=''
          dir=$(pwd -P)
          while :; do
            if [ -x "$dir/node_modules/.bin/genesis" ]; then bin=$dir/node_modules/.bin/genesis; break; fi
            [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = / ] && break
            dir=$(dirname -- "$dir")
          done
          if [ -z "$bin" ]; then
            echo "@marktiderman/genesis-cli is not installed, so the doctor could not run." | tee "$RUNNER_TEMP/genesis-upgrade/doctor.txt"
            exit 1
          fi
          "$bin" doctor 2>&1 | tee "$RUNNER_TEMP/genesis-upgrade/doctor.txt"

      - name: Write the patch
        id: patch
        env:
          LOCKFILE: ${{ steps.app.outputs.lockfile }}
          COUNT: ${{ steps.bump.outputs.count }}
          DOCTOR: ${{ steps.doctor.outcome }}
        run: |
          set -euo pipefail
          out=$RUNNER_TEMP/genesis-upgrade
          if [ "$COUNT" = "0" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          mapfile -t files < "$out/files"
          git diff --binary -- "${files[@]}" "$LOCKFILE" > "$out/upgrade.patch"
          {
            cat "$out/changes.md"
            echo
            case "$DOCTOR" in
              success) echo "\`genesis doctor\` passed after the install." ;;
              failure) echo "**\`genesis doctor\` failed after the install.** Fix the findings on this branch before merging." ;;
              *) echo "\`genesis doctor\` was not run." ;;
            esac
            if [ -f "$out/doctor.txt" ]; then
              echo
              echo "<details><summary>Doctor output</summary>"
              echo
              echo '```text'
              head -c 40000 "$out/doctor.txt"
              echo
              echo '```'
              echo
              echo "</details>"
            fi
            echo
            echo "Opened by the genesis-upgrade workflow; it updates this pull request on its next run."
          } > "$out/body.md"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Hand the patch to the pull request job
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: genesis-upgrade
          path: |
            ${{ runner.temp }}/genesis-upgrade/upgrade.patch
            ${{ runner.temp }}/genesis-upgrade/body.md
          retention-days: 1
          if-no-files-found: error

      # Without a pull request (dry-run), the failure is reported here instead.
      - name: Report the doctor
        if: inputs.dry-run && steps.doctor.outcome == 'failure'
        run: |
          echo "::error title=genesis-upgrade::genesis doctor failed after the upgrade (dry run; nothing was pushed)."
          exit 1

  pr:
    name: Open or update the pull request
    needs: bump
    if: needs.bump.outputs.changed == 'true' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      pull-requests: write
    # Never two runs pushing the same branch at once; a running one finishes.
    concurrency:
      group: genesis-upgrade-${{ github.repository }}-${{ inputs.branch }}
      cancel-in-progress: false
    steps:
      # This job holds a write token, so it runs no code from the repository or its
      # dependencies: only git, gh and the steps below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.token || github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: genesis-upgrade
          path: ${{ runner.temp }}/genesis-upgrade

      - name: Commit, push and open the pull request
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ github.ref_name }}
          VERSION: ${{ needs.bump.outputs.version }}
          DOCTOR: ${{ needs.bump.outputs.doctor }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=genesis-upgrade::$1"; exit 1; }
          dir=$RUNNER_TEMP/genesis-upgrade
          patch=$dir/upgrade.patch
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || fail "unexpected version '$VERSION'"
          git check-ref-format --branch "$BRANCH" > /dev/null || fail "branch '$BRANCH' is not a valid branch name"
          default=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          [ "$BRANCH" != "$BASE" ] && [ "$BRANCH" != "$default" ] || fail "branch '$BRANCH' is the base or default branch; pick a branch of its own"

          # The patch came from a job that ran dependency install scripts: accept only
          # package.json files and lockfiles.
          while IFS=$'\t' read -r _ _ file; do
            case "$file" in *" => "*) fail "the patch renames $file" ;; esac
            case "${file##*/}" in
              package.json|pnpm-lock.yaml|bun.lock|bun.lockb|package-lock.json|npm-shrinkwrap.json) ;;
              *) fail "the patch touches $file, which is not a package.json or a lockfile" ;;
            esac
          done < <(git apply --numstat "$patch")
          git apply --index "$patch"

          title="chore(deps): upgrade Genesis to $VERSION"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$title"

          # Rebuilt from the base on every run, so the push replaces the bot's own branch.
          # When nothing changed since the last run, leave the branch (and its CI) alone.
          if git fetch -q --depth=1 origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2> /dev/null \
            && [ "$(git rev-parse "origin/$BRANCH^{tree}")" = "$(git rev-parse "HEAD^{tree}")" ]; then
            echo "$BRANCH already holds this upgrade."
          else
            git push -q --force origin "HEAD:refs/heads/$BRANCH"
          fi

          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$dir/body.md"
            echo "Updated pull request #$number."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$dir/body.md"
          fi

          if [ "$DOCTOR" = "failure" ]; then
            fail "genesis doctor failed after the upgrade; the pull request lists the findings."
          fi
