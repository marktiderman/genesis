# Genesis upgrade (reusable): moves every @marktiderman/genesis* dependency to
# one Genesis release, reinstalls, runs `genesis doctor` and opens (or updates)
# one pull request.
#
# The schedule lives in the caller (templates/ci/genesis-upgrade.yml is a ready copy):
#
#   on:
#     schedule:
#       - cron: "0 6 * * 1"
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     upgrade:
#       uses: marktiderman/genesis/.github/workflows/genesis-upgrade.yml@<commit sha> # @marktiderman/genesis@<version>
#       with:
#         package-manager: pnpm
#
# How versions are chosen: the umbrella @marktiderman/genesis publishes
# dist/versions.json, the exact version of every package it was released with
# (the same manifest `genesis doctor`'s version-skew rule reads). Packages in it
# move to that version, the umbrella to the release itself, and Genesis packages
# the umbrella doesn't list (the CLI, studio, supabase) to their npm `latest`.
# The range prefix (^, ~ or exact) is kept; workspace:, file:, link:, npm:
# aliases and other ranges are left alone, and nothing is downgraded.
#
# Two jobs, so the job that holds a write token never runs dependency code:
# `bump` (read-only) bumps, installs (install scripts run here) and runs the
# doctor; `pr` makes the same bump again from the same release, writes the
# lockfile with install scripts off, commits only those files and opens the
# pull request. Nothing `bump` wrote reaches the commit; only the doctor's
# output reaches the pull request, as escaped text.
#
# A pull request opened with the default GITHUB_TOKEN does not start other
# workflows, so CI won't run on it until someone pushes. Pass a `token` secret
# (a fine-grained token or a GitHub App token with contents and pull requests
# write) to have CI run on it. With the default token, the repository must allow
# GitHub Actions to create pull requests (Settings > Actions > General).

name: Genesis upgrade (reusable)

on:
  workflow_call:
    inputs:
      package-manager:
        description: "pnpm, bun or npm"
        type: string
        default: pnpm
      package-manager-version:
        description: "pnpm or bun version. Empty: from the lockfile folder's package.json packageManager (bun: then engines.bun, then latest). Ignored for npm."
        type: string
        default: ""
      working-directory:
        description: "Folder whose package.json files are upgraded (every tracked one at or below it), relative to the repository root"
        type: string
        default: "."
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      version:
        description: "The @marktiderman/genesis release to move to: an exact version or an npm dist-tag"
        type: string
        default: latest
      branch:
        description: "Branch the upgrade is pushed to. Empty: genesis-upgrade/<the branch the workflow runs on>"
        type: string
        default: ""
      doctor:
        description: "Run genesis doctor after the install; a failure is reported on the pull request and fails the run"
        type: boolean
        default: true
      dry-run:
        description: "Bump, install and run the doctor, write the run summary, and push nothing"
        type: boolean
        default: false
      timeout-minutes:
        description: "Timeout for each job"
        type: number
        default: 20
    secrets:
      token:
        description: "Optional token for the push and the pull request, so the pull request's own CI runs. Default: GITHUB_TOKEN."
        required: false
      npm-token:
        description: "Optional registry token, exposed as NODE_AUTH_TOKEN to installs and npm lookups (for an .npmrc that reads it)"
        required: false
    outputs:
      version:
        description: "The @marktiderman/genesis version the run upgraded to"
        value: ${{ jobs.bump.outputs.version }}
      changed:
        description: "true when there was something to upgrade"
        value: ${{ jobs.bump.outputs.changed }}

# The bump, shared by both jobs so they make exactly the same change. Reads TARGET
# (a version or dist-tag); writes $RUNNER_TEMP/genesis-upgrade/{files,changes.md}
# and the step outputs version and count.
env:
  GENESIS_BUMP: |
    import { execFileSync } from "node:child_process";
    import { appendFileSync, mkdirSync, mkdtempSync, readFileSync, writeFileSync } from "node:fs";
    import path from "node:path";

    // The bump itself is `genesis upgrade`'s, embedded from packages/genesis-cli/src/upgrade/bump-core.mjs
    // by `node scripts/sync-genesis-bump.mjs` (a test fails when it drifts). Edit it there, not here.
    // <genesis-bump-core>
    // The lockstep bump, shared by `genesis upgrade` and the reusable genesis-upgrade workflow.
    // Plain JavaScript with no imports, because the workflow embeds this file verbatim between its
    // genesis-bump-core markers (`node scripts/sync-genesis-bump.mjs` rewrites them; a test fails when
    // they drift). Edit it here, never in the workflow.
    export const UMBRELLA = "@marktiderman/genesis";
    export const GENESIS = /^@marktiderman\/genesis(-[a-z0-9-]+)?$/;
    export const EXACT = /^(\^|~|=)?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/;
    export const SECTIONS = ["dependencies", "devDependencies", "optionalDependencies"];

    // semver precedence: x.y.z, then a release above its prereleases, then prerelease fields.
    export function compareVersions(a, b) {
      const [ca, pa = ""] = a.split(/-(.*)/s);
      const [cb, pb = ""] = b.split(/-(.*)/s);
      const x = ca.split(".").map(Number), y = cb.split(".").map(Number);
      for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i];
      if (!pa || !pb) return (pa ? 0 : 1) - (pb ? 0 : 1);
      const fa = pa.split("."), fb = pb.split(".");
      for (let i = 0; i < Math.max(fa.length, fb.length); i++) {
        if (fa[i] === undefined) return -1;
        if (fb[i] === undefined) return 1;
        const na = /^\d+$/.test(fa[i]), nb = /^\d+$/.test(fb[i]);
        if (na && nb && Number(fa[i]) !== Number(fb[i])) return Number(fa[i]) - Number(fb[i]);
        if (na !== nb) return na ? -1 : 1;
        if (fa[i] !== fb[i]) return fa[i] < fb[i] ? -1 : 1;
      }
      return 0;
    }

    // One package.json's bump. `wanted(name)` is the version a Genesis package moves to, or null when
    // there is none. The range prefix (^, ~ or exact) is kept; workspace:, file:, link:, npm: aliases and
    // other ranges are left alone, and nothing is downgraded. `text` is null when nothing changed.
    export function bumpPackageJson(file, text, wanted) {
      const pkg = JSON.parse(text);
      const changes = [], skipped = [];
      for (const section of SECTIONS) {
        for (const [name, spec] of Object.entries(pkg[section] ?? {})) {
          if (!GENESIS.test(name)) continue;
          const m = EXACT.exec(spec);
          if (!m) { skipped.push({ file, name, spec, why: "not a plain version" }); continue; }
          const want = wanted(name);
          if (!want) { skipped.push({ file, name, spec, why: "no latest version on npm" }); continue; }
          const cmp = compareVersions(want, m[2]);
          if (cmp === 0) continue;
          if (cmp < 0) { skipped.push({ file, name, spec, why: `newer than ${want}` }); continue; }
          pkg[section][name] = `${m[1] ?? ""}${want}`;
          changes.push({ file, name, from: spec, to: pkg[section][name] });
        }
      }
      if (!changes.length) return { text: null, changes, skipped };
      const indent = /^[ \t]+(?=")/m.exec(text)?.[0] ?? "  ";
      return { text: JSON.stringify(pkg, null, indent) + (text.endsWith("\n") ? "\n" : ""), changes, skipped };
    }

    // The pull request body's table, the same for the CLI and the workflow.
    export function bumpSummary(version, changes, skipped) {
      const row = (c) => `| \`${c.name}\` | ${c.from} | ${c.to} | ${c.file} |`;
      return [
        `Moves every Genesis package to the **${UMBRELLA}@${version}** release: the versions in its \`versions.json\`, and npm \`latest\` for packages it doesn't list.`,
        "",
        changes.length ? ["| Package | From | To | File |", "| --- | --- | --- | --- |", ...changes.map(row)].join("\n") : "Nothing to change.",
        ...(skipped.length ? ["", "Left alone:", "", ...skipped.map((s) => `- \`${s.name}\` ${s.spec} in ${s.file}: ${s.why}`)] : []),
      ].join("\n");
    }
    // </genesis-bump-core>

    const env = process.env;
    const out = path.join(env.RUNNER_TEMP, "genesis-upgrade");
    mkdirSync(out, { recursive: true });
    const fail = (msg) => { console.log(`::error title=genesis-upgrade::${msg}`); process.exit(1); };
    const run = (cmd, args) => {
      try {
        return execFileSync(cmd, args, { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }).trim();
      } catch (err) {
        fail(`${cmd} ${args.join(" ")} failed: ${String(err.stderr || err.message).trim().split("\n").slice(-3).join(" ")}`);
      }
    };
    // The release: an exact version or a dist-tag, never a range.
    const target = env.TARGET || "latest";
    if (!/^[0-9A-Za-z][0-9A-Za-z.+-]*$/.test(target)) fail(`version must be an exact version or a dist-tag, not "${target}"`);
    const version = JSON.parse(run("npm", ["view", `${UMBRELLA}@${target}`, "version", "--json"]) || "null");
    if (typeof version !== "string") fail(`${UMBRELLA}@${target} is not one published version`);

    // Its manifest, from the published tarball.
    const tmp = mkdtempSync(path.join(env.RUNNER_TEMP, "genesis-umbrella-"));
    const [packed] = JSON.parse(run("npm", ["pack", `${UMBRELLA}@${version}`, "--pack-destination", tmp, "--json"]));
    run("tar", ["-xzf", path.join(tmp, packed.filename), "-C", tmp, "package/dist/versions.json"]);
    const manifest = JSON.parse(readFileSync(path.join(tmp, "package/dist/versions.json"), "utf8"));
    if (manifest.version !== version) fail(`${UMBRELLA}@${version} ships a versions.json for ${manifest.version}`);
    const pinned = { [UMBRELLA]: version, ...manifest.packages };

    const latest = new Map();
    const wanted = (name) => {
      if (name in pinned) return pinned[name];
      if (!latest.has(name)) {
        let v = null;
        try { v = JSON.parse(execFileSync("npm", ["view", `${name}@latest`, "version", "--json"], { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }) || "null"); } catch {}
        latest.set(name, typeof v === "string" ? v : null);
      }
      return latest.get(name);
    };
    const changes = [], skipped = [], files = [];
    const candidates = run("git", ["ls-files", "-z", "--", ":(glob)**/package.json"]).split("\0").filter(Boolean);
    for (const file of candidates) {
      const result = bumpPackageJson(file, readFileSync(file, "utf8"), wanted);
      changes.push(...result.changes);
      skipped.push(...result.skipped);
      if (result.text !== null) {
        writeFileSync(file, result.text);
        files.push(path.relative(env.GITHUB_WORKSPACE, path.resolve(file)));
      }
    }

    writeFileSync(path.join(out, "files"), files.join("\n"));
    const body = bumpSummary(version, changes, skipped);
    writeFileSync(path.join(out, "changes.md"), body + "\n");
    appendFileSync(env.GITHUB_STEP_SUMMARY, body + "\n");
    appendFileSync(env.GITHUB_OUTPUT, `version=${version}\ncount=${changes.length}\n`);
    console.log(body);

jobs:
  bump:
    name: Bump, install and run the doctor
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      changed: ${{ steps.bump.outputs.count != '0' }}
      doctor: ${{ steps.doctor.outcome }}
    steps:
      - name: Check the trigger
        env:
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request_target" ] || [ "$REF_TYPE" != "branch" ]; then
            echo "::error title=genesis-upgrade::Run genesis-upgrade on a branch (schedule or workflow_dispatch); the pull request targets that branch."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the app and its lockfile
        id: app
        env:
          PM: ${{ inputs.package-manager }}
          WD: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=genesis-upgrade::$1"; exit 1; }
          case "$PM" in
            pnpm) locks="pnpm-lock.yaml" ;;
            bun) locks="bun.lock bun.lockb" ;;
            npm) locks="package-lock.json npm-shrinkwrap.json" ;;
            *) fail "package-manager must be pnpm, bun or npm, not '$PM'" ;;
          esac
          ws=$(pwd -P)
          app=$(cd -- "$WD" 2>/dev/null && pwd -P) || fail "working-directory '$WD' does not exist"
          case "$app/" in "$ws"/*) ;; *) fail "working-directory '$WD' is outside the repository" ;; esac
          [ -f "$app/package.json" ] || fail "working-directory '$WD' has no package.json"
          dir=$app
          lockfile=''
          while :; do
            for l in $locks; do
              if [ -f "$dir/$l" ]; then lockfile=$dir/$l; break 2; fi
            done
            [ "$dir" = "$ws" ] && break
            dir=$(dirname -- "$dir")
          done
          [ -n "$lockfile" ] || fail "no $PM lockfile ($locks) in '$WD' or a folder above it"
          rel() { local p=${1#"$ws"}; p=${p#/}; echo "${p:-.}"; }
          echo "root=$(rel "$(dirname -- "$lockfile")")" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ inputs.package-manager-version }}
          package_json_file: ${{ steps.app.outputs.root }}/package.json

      - name: Set up Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.package-manager-version }}
          bun-version-file: ${{ steps.app.outputs.root }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Bump @marktiderman/genesis* to one release
        id: bump
        working-directory: ${{ inputs.working-directory }}
        env:
          TARGET: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: node --input-type=module -e "$GENESIS_BUMP"

      - name: Install
        if: steps.bump.outputs.count != '0'
        working-directory: ${{ steps.app.outputs.root }}
        env:
          PM: ${{ inputs.package-manager }}
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) pnpm install --no-frozen-lockfile ;;
            bun) bun install ;;
            npm) npm install ;;
          esac

      - name: genesis doctor
        id: doctor
        if: steps.bump.outputs.count != '0' && inputs.doctor
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -uo pipefail
          bin=''
          dir=$(pwd -P)
          while :; do
            if [ -x "$dir/node_modules/.bin/genesis" ]; then bin=$dir/node_modules/.bin/genesis; break; fi
            [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = / ] && break
            dir=$(dirname -- "$dir")
          done
          if [ -z "$bin" ]; then
            echo "@marktiderman/genesis-cli is not installed, so the doctor could not run." | tee "$RUNNER_TEMP/genesis-upgrade/doctor.txt"
            exit 1
          fi
          "$bin" doctor 2>&1 | tee "$RUNNER_TEMP/genesis-upgrade/doctor.txt"

      - name: Hand the doctor's output to the pull request job
        if: steps.doctor.outcome == 'success' || steps.doctor.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: genesis-upgrade-doctor
          path: ${{ runner.temp }}/genesis-upgrade/doctor.txt
          retention-days: 1
          if-no-files-found: error

      # Without a pull request (dry-run), the failure is reported here instead.
      - name: Report the doctor
        if: inputs.dry-run && steps.doctor.outcome == 'failure'
        run: |
          echo "::error title=genesis-upgrade::genesis doctor failed after the upgrade (dry run; nothing was pushed)."
          exit 1

  pr:
    name: Open or update the pull request
    needs: bump
    if: needs.bump.outputs.changed == 'true' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      pull-requests: write
    # Never two runs pushing the same branch at once; a running one finishes.
    concurrency:
      group: genesis-upgrade-${{ github.repository }}-${{ github.ref_name }}-${{ inputs.branch }}
      cancel-in-progress: false
    steps:
      # This job holds a write token, so it runs no dependency code: the bump script,
      # a lockfile-only install with install scripts off, git and gh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.token || github.token }}

      - name: Find the lockfile
        id: app
        env:
          PM: ${{ inputs.package-manager }}
          WD: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) locks="pnpm-lock.yaml" ;;
            bun) locks="bun.lock bun.lockb" ;;
            *) locks="package-lock.json npm-shrinkwrap.json" ;;
          esac
          ws=$(pwd -P)
          dir=$(cd -- "$WD" && pwd -P)
          lockfile=''
          while :; do
            for l in $locks; do
              if [ -f "$dir/$l" ]; then lockfile=$dir/$l; break 2; fi
            done
            [ "$dir" = "$ws" ] && break
            dir=$(dirname -- "$dir")
          done
          [ -n "$lockfile" ] || { echo "::error title=genesis-upgrade::no lockfile found"; exit 1; }
          rel() { local p=${1#"$ws"}; p=${p#/}; echo "${p:-.}"; }
          echo "root=$(rel "$(dirname -- "$lockfile")")" >> "$GITHUB_OUTPUT"
          echo "lockfile=$(rel "$lockfile")" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ inputs.package-manager-version }}
          package_json_file: ${{ steps.app.outputs.root }}/package.json

      - name: Set up Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.package-manager-version }}
          bun-version-file: ${{ steps.app.outputs.root }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      # The same release the bump job resolved, so both jobs make the same change.
      - name: Bump again
        id: bump
        working-directory: ${{ inputs.working-directory }}
        env:
          TARGET: ${{ needs.bump.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: node --input-type=module -e "$GENESIS_BUMP"

      - name: Write the lockfile (install scripts off)
        working-directory: ${{ steps.app.outputs.root }}
        env:
          PM: ${{ inputs.package-manager }}
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) pnpm install --lockfile-only --ignore-scripts ;;
            bun) bun install --lockfile-only --ignore-scripts ;;
            npm) npm install --package-lock-only --ignore-scripts ;;
          esac

      - name: Get the doctor's output
        if: needs.bump.outputs.doctor == 'success' || needs.bump.outputs.doctor == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: genesis-upgrade-doctor
          path: ${{ runner.temp }}/genesis-upgrade-doctor

      - name: Commit, push and open the pull request
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          BRANCH_INPUT: ${{ inputs.branch }}
          BASE: ${{ github.ref_name }}
          VERSION: ${{ steps.bump.outputs.version }}
          COUNT: ${{ steps.bump.outputs.count }}
          LOCKFILE: ${{ steps.app.outputs.lockfile }}
          DOCTOR: ${{ needs.bump.outputs.doctor }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=genesis-upgrade::$1"; exit 1; }
          bot_name="github-actions[bot]"
          bot_email="41898282+github-actions[bot]@users.noreply.github.com"
          dir=$RUNNER_TEMP/genesis-upgrade
          [ "$COUNT" != "0" ] || { echo "Nothing to upgrade any more."; exit 0; }
          branch=${BRANCH_INPUT:-genesis-upgrade/$BASE}
          git check-ref-format --branch "$branch" > /dev/null || fail "branch '$branch' is not a valid branch name"
          default=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          [ "$branch" != "$BASE" ] && [ "$branch" != "$default" ] || fail "branch '$branch' is the base or default branch; pick a branch of its own"

          mapfile -t files < "$dir/files"
          git add -- "${files[@]}" "$LOCKFILE"
          title="chore(deps): upgrade Genesis to $VERSION"
          git -c user.name="$bot_name" -c user.email="$bot_email" commit -q -m "$title"

          # The branch is rebuilt from the base on every run, but only while it holds
          # nothing but the bot's own commit: fixes pushed to it are never overwritten.
          lease=""
          if git fetch -q --depth=2 origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2> /dev/null; then
            remote=$(git rev-parse "origin/$branch")
            author=$(git log -1 --format=%ae "$remote")
            parents=$(git rev-list --parents -n 1 "$remote" | wc -w)
            if [ "$author" != "$bot_email" ] || [ "$parents" -ne 2 ]; then
              echo "::warning title=genesis-upgrade::$branch has commits that aren't the bot's; left it alone. Merge or close its pull request, or delete the branch, and the next run starts it again."
              exit 0
            fi
            lease="--force-with-lease=refs/heads/$branch:$remote"
            if [ "$(git rev-parse "$remote^{tree}")" = "$(git rev-parse "HEAD^{tree}")" ]; then
              echo "$branch already holds this upgrade."
              lease="skip"
            fi
          else
            lease="--force-with-lease=refs/heads/$branch:"
          fi
          [ "$lease" = "skip" ] || git push -q "$lease" origin "HEAD:refs/heads/$branch"

          {
            cat "$dir/changes.md"
            echo
            case "$DOCTOR" in
              success) echo "\`genesis doctor\` passed after the install." ;;
              failure) echo "**\`genesis doctor\` failed after the install.** Push the fixes to this branch; the next runs leave a branch with your commits alone." ;;
              *) echo "\`genesis doctor\` was not run." ;;
            esac
            report=$RUNNER_TEMP/genesis-upgrade-doctor/doctor.txt
            if [ -f "$report" ]; then
              echo
              echo "<details><summary>Doctor output</summary>"
              echo
              echo "<pre>"
              head -c 40000 "$report" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
              echo "</pre>"
              echo "</details>"
            fi
            echo
            echo "Opened by the genesis-upgrade workflow; it updates this pull request on its next run."
          } > "$dir/body.md"

          # Only a pull request from this repository's own branch, never a fork's of the same name.
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$BASE" --state open \
            --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$dir/body.md"
            echo "Updated pull request #$number."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$branch" --title "$title" --body-file "$dir/body.md"
          fi

          if [ "$DOCTOR" = "failure" ]; then
            fail "genesis doctor failed after the upgrade; the pull request lists the findings."
          fi
