name: Conformance allow list

# A pull request may not grow apps/sample/conformance/allow.json (fix the finding instead) unless it
# carries the label "conformance: allow grows" with a reason the reviewer accepts. Its own workflow,
# so adding or removing the label re-runs only this check, never the Conformance run.
#
# The label stays on through later pushes, like a reviewer's approval of the entries it covers: the
# reviewer who adds it removes and re-adds it after a push that changes allow.json, as with
# `review: approved` (AGENTS.md, Adversarial review gate).

on:
  pull_request:
    branches: [main, "staging/**", "prestage/**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # No path filter: a required check must report on every pull request, and the job is quick
    # (a list that didn't change passes at once).

permissions:
  contents: read

concurrency:
  group: conformance-allow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  allow-grew:
    name: Conformance allow list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.26.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # allow-grew.ts compares entries with @marktiderman/genesis-cli/verify, which resolves to its
      # built dist/: build the CLI and the workspace packages it depends on.
      - name: Build genesis-cli
        run: pnpm --filter "@marktiderman/genesis-cli..." build
      - name: The allow list doesn't grow without the label
        env:
          ALLOW_GROWS: "${{ contains(github.event.pull_request.labels.*.name, 'conformance: allow grows') && '1' || '0' }}"
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          pnpm --filter sample exec tsx conformance/allow-grew.ts FETCH_HEAD
