# Temporary: checks that scripts/create-tag-ref.sh can create a tag with GITHUB_TOKEN where a
# `git push` of the same tag is refused. Removed before merge.
name: Tag probe (temporary)
on:
  pull_request:
    paths: [".github/workflows/tmp-tag-probe.yml"]
permissions: {}
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: git push of a tag (expected to be refused)
        run: |
          git tag probe/push-${{ github.run_id }} HEAD
          git push origin refs/tags/probe/push-${{ github.run_id }} && echo "PUSH ACCEPTED" || echo "PUSH REFUSED"
          git push origin :refs/tags/probe/push-${{ github.run_id }} || true
      - name: API tag (expected to work)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/create-tag-ref.sh probe/api-${{ github.run_id }} "$(git rev-parse HEAD)"
          scripts/create-tag-ref.sh probe/api-${{ github.run_id }} "$(git rev-parse HEAD)"
          gh api -X DELETE repos/$GITHUB_REPOSITORY/git/refs/tags/probe/api-${{ github.run_id }}
