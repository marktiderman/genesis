# A measurement, not a build. It answers ONE question: does npm accept this
# repository as a Trusted Publisher for each of the six genesis packages?
#
# WHY it exists. The Release run publishes with `changeset publish` and every
# package fails with `E404 ... PUT https://registry.npmjs.org/@marktiderman%2f<pkg>`.
# `E404` on a PUT is npm's answer to an UNAUTHORIZED write on a scoped package.
# npm's OIDC code (`lib/utils/oidc.js`) returns EARLY AND SILENT on every one of
# its eight failure conditions, so a failed exchange leaves no line in the log.
# This job does the same exchange with `curl` and prints the HTTP status code.
#
# The response body of a SUCCESSFUL exchange holds a publish token. This job
# prints the body only when the status is NOT 200. It never prints the token.
name: OIDC probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    name: Ask npm for a publish token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exchange the GitHub ID token for an npm publish token
        run: |
          set -u
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          ID_TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))')
          if [ -z "$ID_TOKEN" ]; then
            echo "FAIL: GitHub returned no ID token."
            exit 1
          fi
          echo "GitHub ID token length: ${#ID_TOKEN}"
          for PKG in genesis-core genesis-ui genesis-design-system genesis-ui-native genesis-switchboard genesis genesis-cli; do
            CODE=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
              -X POST \
              -H 'Content-Type: application/json' \
              -d "{\"idToken\":\"$ID_TOKEN\"}" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@marktiderman%2f$PKG")
            if [ "$CODE" = "200" ]; then
              echo "$PKG -> 200 (a publish token was issued; body not printed)"
            else
              echo "$PKG -> $CODE"
              head -c 400 /tmp/body.json
              echo
            fi
          done
