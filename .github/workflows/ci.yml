name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-typecheck-test:
    name: Build, typecheck, test
    # Version-packages PRs only bump versions and changelogs; the code already passed CI on the release PR.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway Postgres for genesis-studio-server's integration tests,
    # which run as the signed-in user against real RLS. Without the env var
    # below those tests skip, so every other package's tests are unaffected.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      STUDIO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

  storybook-browser-tests:
    name: Storybook browser tests
    # Version-packages PRs only bump versions and changelogs; the code already passed CI on the release PR.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Stories render @marktiderman/genesis-ui by its built dist/ output.
      - name: Build packages
        run: pnpm build:packages

      # Installs the Chromium build matching apps/sample's pinned
      # `playwright` devDependency, plus its OS libraries.
      - name: Install Playwright Chromium
        working-directory: apps/sample
        run: pnpm exec playwright install --with-deps chromium

      # Every story renders as a Vitest browser test (headless Chromium)
      # with an axe a11y check; see apps/sample/vitest.config.ts.
      - name: Run Storybook browser tests
        run: pnpm --filter sample test:storybook
