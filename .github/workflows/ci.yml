name: CI

on:
  push:
    branches: [main]
  # PRs into a batch run the full CI too, so a failure shows on the PR that caused it rather
  # than on the release PR into main.
  pull_request:
    branches: [main, "staging/**", "prestage/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-typecheck-test:
    name: Build, typecheck, test
    # Version-packages PRs only bump versions and changelogs; the code already passed CI on the release PR.
    # Skip only the trusted Version Packages PR; a fork branch of the same name always runs.
    if: github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway Postgres for genesis-studio-server's integration tests,
    # which run as the signed-in user against real RLS. Without the env var
    # below those tests skip, so every other package's tests are unaffected.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      STUDIO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Genesis is public: no app or customer built on it is named here (hashes in the script).
      - name: No private names
        run: node scripts/check-private-names.mjs

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      # Every package's genesis layer and group, and dependencies pointing down: foundation,
      # primitives, modules, with tooling on the side (docs/PACKAGE-STRATEGY.md, "Layers").
      - name: Package layers
        run: pnpm check:package-layers

      # .github/CODEOWNERS is generated from each package's genesis.owner.
      - name: Code owners
        run: pnpm check:codeowners

      - name: Typecheck
        run: pnpm typecheck

      # Two packages at a time: every package's test runner at once starved the runner, and
      # async UI tests (forms-native, the native starter) timed out on CI only.
      - name: Test
        run: pnpm -r --workspace-concurrency=2 test && pnpm test:scripts

      # features.ts against the repo: generated files, code paths, ids, tags. On a PR it also
      # checks feature:<id> labels; the labels go through env, never into the script text.
      - name: Feature registry
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: pnpm features check --labels "$LABELS"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      # docs/GLOSSARY.md's banned synonyms in package descriptions and doc headings. Warn mode:
      # it reports and passes until the glossary is settled (then --strict).
      - name: Glossary (warn mode)
        run: pnpm check:glossary

      # A pull request that adds a package links an ADR (docs/adr/TEMPLATE.md).
      - name: ADR for new packages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        # The description is read now, not from the event, so editing it and re-running the job
        # is enough after adding an ADR link.
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          PR_BODY="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')" \
            node scripts/check-adr-required.mjs --base "origin/$BASE_REF"

      # New exports follow the prefix rules (docs/FRAMEWORK.md, rule 7); existing names stay.
      - name: Export prefixes on new exports
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node scripts/check-export-prefixes.mjs --base "origin/$BASE_REF"

      # The rules of engagement a script can check (docs/agents/RULES.md): a new package starts
      # at 0.1.0 with patch changesets; a workflow on PRs into main also runs on the batches.
      - name: Agent rules
        run: pnpm exec genesis agents --rules

      # A workflow file GitHub can't parse fails with no jobs and no CI signal (an empty `env:`
      # once stopped Release outright), so every workflow is linted here. Pinned by checksum.
      - name: Lint workflows (actionlint)
        env:
          VERSION: 1.7.11
          SHA256: 900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color

  storybook-browser-tests:
    name: Storybook browser tests
    # Version-packages PRs only bump versions and changelogs; the code already passed CI on the release PR.
    # Skip only the trusted Version Packages PR; a fork branch of the same name always runs.
    if: github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Stories render @marktiderman/genesis-ui by its built dist/ output.
      - name: Build packages
        run: pnpm build:packages

      # Installs the Chromium build matching apps/sample's pinned
      # `playwright` devDependency, plus its OS libraries.
      - name: Install Playwright Chromium
        working-directory: apps/sample
        run: pnpm exec playwright install --with-deps chromium

      # Every story renders as a Vitest browser test (headless Chromium)
      # with an axe a11y check; see apps/sample/vitest.config.ts.
      - name: Run Storybook browser tests
        run: pnpm --filter sample test:storybook

      # The public site (genesisone.dev): every page prerenders and the
      # sitemap, robots.txt and llms.txt are written, as the deploy does.
      - name: Build the site
        run: pnpm --filter sample build

      # Opens every page of the built site in headless Chromium: it fails when
      # a page throws, logs an error, shows the error screen, answers non-200,
      # or (one page per route) breaks an axe rule. See scripts/smoke-site.mjs.
      - name: Smoke-test every page
        run: pnpm --filter sample smoke
