name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-typecheck-test:
    name: Build, typecheck, test
    # Version-packages PRs only bump versions and changelogs; the code already passed CI on the release PR.
    # Skip only the trusted Version Packages PR; a fork branch of the same name always runs.
    if: github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway Postgres for genesis-studio-server's integration tests,
    # which run as the signed-in user against real RLS. Without the env var
    # below those tests skip, so every other package's tests are unaffected.
    services:
      postgres:
        # Docker's official image through AWS's public mirror: Docker Hub's anonymous pull
        # limit is shared by every job on a runner's IP.
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      STUDIO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # Genesis is public: no app or customer built on it is named here (hashes in the script).
      - name: No private names
        run: node scripts/check-private-names.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

      # Two packages at a time: every package's test runner at once starved the runner, and
      # async UI tests (forms-native, the native starter) timed out on CI only.
      - name: Test
        run: pnpm -r --workspace-concurrency=2 test && pnpm test:scripts

      # features.ts against the repo: generated files, code paths, ids, tags. On a PR it also
      # checks feature:<id> labels; the labels go through env, never into the script text.
      - name: Feature registry
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: pnpm features check --labels "$LABELS"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

  storybook-browser-tests:
    name: Storybook browser tests
    # Version-packages PRs only bump versions and changelogs; the code already passed CI on the release PR.
    # Skip only the trusted Version Packages PR; a fork branch of the same name always runs.
    if: github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Stories render @marktiderman/genesis-ui by its built dist/ output.
      - name: Build packages
        run: pnpm build:packages

      # Installs the Chromium build matching apps/sample's pinned
      # `playwright` devDependency, plus its OS libraries.
      - name: Install Playwright Chromium
        working-directory: apps/sample
        run: pnpm exec playwright install --with-deps chromium

      # Every story renders as a Vitest browser test (headless Chromium)
      # with an axe a11y check; see apps/sample/vitest.config.ts.
      - name: Run Storybook browser tests
        run: pnpm --filter sample test:storybook
