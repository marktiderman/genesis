name: Deploy Pages

# Publishes the sample app + Storybook to GitHub Pages on every push to main:
#   /            → apps/sample (React Router, every page prerendered)
#   /storybook/  → apps/sample's Storybook, built against the same
#                  @marktiderman/genesis-ui the sample app consumes
#
# Requires a one-time repo setting: Settings → Pages → Source → "GitHub
# Actions" (the default "Deploy from a branch" won't pick this up).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.26.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # apps/sample imports @marktiderman/genesis-ui etc. by their built
      # dist/ output (package.json main/exports), not source — same
      # prerequisite as every other build in this repo.
      - name: Build packages
        run: pnpm build:packages

      # SPA mode (ssr: false) with every page prerendered (app/lib/site-paths.ts),
      # then sitemap.xml, robots.txt and llms.txt (scripts/generate-site-files.ts).
      # The site is served at the root of its custom domain
      # (https://genesisone.dev, set in the repo's Pages settings), so it
      # builds at "/". Set PAGES_BASE here to build for a subpath instead.
      - name: Build sample app
        working-directory: apps/sample
        run: pnpm build

      # The sites demo is written into the client build by a Vite plugin; if a toolchain change
      # stops it, /sites shows 404 frames while the deploy stays green. Fail here instead.
      - name: Check the sites demo was built
        run: test -f apps/sample/build/client/sites-demo/landing/index.html || { echo "::error::The sites demo wasn't prerendered (apps/sample/sites-demo/vite-plugin.ts)."; exit 1; }

      # Storybook's Vite builder already emits relative asset paths
      # (base: './'), so it needs no subpath configuration of its own —
      # it works unmodified at any deploy depth.
      - name: Build Storybook
        working-directory: apps/sample
        run: pnpm build-storybook

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -r apps/sample/build/client/. dist/
          # Every page is prerendered to its own index.html, so deep links
          # answer 200. Any other path gets Pages' 404.html: the SPA shell,
          # which hands control to react-router's client router. (index.html
          # is now the prerendered home page, not the shell.)
          cp dist/__spa-fallback.html dist/404.html
          mkdir -p dist/storybook
          cp -r apps/sample/storybook-static/. dist/storybook/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
