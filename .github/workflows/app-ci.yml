# Genesis app CI (reusable): install, typecheck, lint, test, `genesis doctor`
# and `genesis features check` for one Genesis app.
#
# Call it from the app's own workflow (templates/ci/app-ci.yml is a ready copy):
#
#   jobs:
#     app:
#       uses: marktiderman/genesis/.github/workflows/app-ci.yml@<commit sha> # @marktiderman/genesis@<version>
#       with:
#         package-manager: pnpm
#
# Pin a release commit, not @main: docs/APP-CI.md explains the ref strategy.
#
# Every input reaches a shell through `env:`, never inside the script text, so
# a script name or path can't inject commands. The job reads the repository
# and nothing else (`contents: read`).

name: Genesis app CI (reusable)

on:
  workflow_call:
    inputs:
      package-manager:
        description: "pnpm, bun or npm"
        type: string
        default: pnpm
      package-manager-version:
        description: "pnpm or bun version. Empty: from package.json packageManager (bun: then engines.bun, then latest). Ignored for npm, which comes with Node."
        type: string
        default: ""
      working-directory:
        description: "The app's folder, relative to the repository root. Its lockfile may be here or in a folder above it (a workspace root)."
        type: string
        default: "."
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      typecheck-script:
        description: "package.json script that typechecks. Empty skips the step."
        type: string
        default: typecheck
      lint-script:
        description: "package.json script that lints. Empty skips the step."
        type: string
        default: lint
      test-script:
        description: "package.json script that runs the tests. Empty skips the step."
        type: string
        default: test
      doctor:
        description: "Run genesis doctor (from the app's installed @marktiderman/genesis-cli)"
        type: boolean
        default: true
      doctor-strict:
        description: "Fail the doctor on warnings too (genesis doctor --strict)"
        type: boolean
        default: false
      features:
        description: "Run genesis features check: auto (when the app has a feature registry), true or false"
        type: string
        default: auto
      timeout-minutes:
        description: "Job timeout"
        type: number
        default: 20
    secrets:
      npm-token:
        description: "Optional registry token, exposed as NODE_AUTH_TOKEN to the install (for an .npmrc that reads it)"
        required: false

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    # One run per pull request and app: a newer push to it cancels the older run. Pushes
    # group by commit, so a push never cancels or displaces another commit's run.
    concurrency:
      group: genesis-app-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ inputs.working-directory }}-${{ inputs.package-manager }}-${{ inputs.node-version }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # pull_request_target runs with the base repository's token and secrets;
      # checking out and running a pull request's code there hands both to it.
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "::error title=app-ci::Call app-ci from a pull_request workflow, not pull_request_target: it runs the pull request's code."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the doctor's supabase pack compares migrations with the base
          # branch, which needs the merge base and the files (for rename detection).
          fetch-depth: 0

      - name: Find the app and its lockfile
        id: app
        env:
          PM: ${{ inputs.package-manager }}
          WD: ${{ inputs.working-directory }}
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=app-ci::$1"; exit 1; }
          case "$PM" in
            pnpm) locks="pnpm-lock.yaml" ;;
            bun) locks="bun.lock bun.lockb" ;;
            npm) locks="package-lock.json npm-shrinkwrap.json" ;;
            *) fail "package-manager must be pnpm, bun or npm, not '$PM'" ;;
          esac
          case "$FEATURES" in auto|true|false) ;; *) fail "features must be auto, true or false, not '$FEATURES'" ;; esac
          ws=$(pwd -P)
          app=$(cd -- "$WD" 2>/dev/null && pwd -P) || fail "working-directory '$WD' does not exist"
          case "$app/" in "$ws"/*) ;; *) fail "working-directory '$WD' is outside the repository" ;; esac
          [ -f "$app/package.json" ] || fail "working-directory '$WD' has no package.json"
          dir=$app
          lockfile=''
          while :; do
            for l in $locks; do
              if [ -f "$dir/$l" ]; then lockfile=$dir/$l; break 2; fi
            done
            [ "$dir" = "$ws" ] && break
            dir=$(dirname -- "$dir")
          done
          [ -n "$lockfile" ] || fail "no $PM lockfile ($locks) in '$WD' or a folder above it. Commit one: CI installs exactly what it records."
          rel() { local p=${1#"$ws"}; p=${p#/}; echo "${p:-.}"; }
          echo "root=$(rel "$(dirname -- "$lockfile")")" >> "$GITHUB_OUTPUT"
          echo "lockfile=$(rel "$lockfile")" >> "$GITHUB_OUTPUT"
          echo "Using $(rel "$lockfile") for the app in $(rel "$app")."

      - name: Set up pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ inputs.package-manager-version }}
          package_json_file: ${{ steps.app.outputs.root }}/package.json

      - name: Set up Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.package-manager-version }}
          bun-version-file: ${{ steps.app.outputs.root }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          # setup-node caches the pnpm and npm stores; Bun's cache is the next step.
          cache: ${{ inputs.package-manager != 'bun' && inputs.package-manager || '' }}
          cache-dependency-path: ${{ steps.app.outputs.lockfile }}
          package-manager-cache: false

      - name: Cache Bun's install cache
        if: inputs.package-manager == 'bun'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: genesis-bun-${{ runner.os }}-${{ hashFiles(steps.app.outputs.lockfile) }}
          restore-keys: genesis-bun-${{ runner.os }}-

      - name: Install (frozen lockfile)
        working-directory: ${{ steps.app.outputs.root }}
        env:
          PM: ${{ inputs.package-manager }}
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            npm) npm ci ;;
          esac

      # A named script the app doesn't have fails here, loudly, instead of being skipped.
      - name: Plan the checks
        id: plan
        working-directory: ${{ inputs.working-directory }}
        env:
          TYPECHECK: ${{ inputs.typecheck-script }}
          LINT: ${{ inputs.lint-script }}
          TEST: ${{ inputs.test-script }}
          DOCTOR: ${{ inputs.doctor }}
          FEATURES: ${{ inputs.features }}
        run: |
          node --input-type=module - <<'JS'
            import { existsSync, readFileSync, appendFileSync } from "node:fs";
            import path from "node:path";
            const env = process.env;
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const scripts = pkg.scripts ?? {};
            const missing = [["typecheck-script", env.TYPECHECK], ["lint-script", env.LINT], ["test-script", env.TEST]]
              .filter(([, name]) => name && !Object.hasOwn(scripts, name));
            for (const [input, name] of missing) {
              console.log(`::error title=app-ci::package.json has no "${name}" script (${input}). Add it, name another, or pass ${input}: "" to skip it.`);
            }
            const config = existsSync("genesis.config.json") ? JSON.parse(readFileSync("genesis.config.json", "utf8")) : {};
            const hasRegistry = ["src/features.ts", "features.ts"].some((f) => existsSync(f)) || pkg.genesisFeatures !== undefined || config.features !== undefined;
            const features = env.FEATURES === "true" || (env.FEATURES === "auto" && hasRegistry);
            // The installed CLI: in the app, or in a workspace root above it.
            let bin = "";
            if (features || env.DOCTOR === "true") {
              for (let dir = process.cwd(); ; dir = path.dirname(dir)) {
                const candidate = path.join(dir, "node_modules", ".bin", "genesis");
                if (existsSync(candidate)) { bin = candidate; break; }
                if (dir === env.GITHUB_WORKSPACE || path.dirname(dir) === dir) break;
              }
              if (!bin) console.log("::error title=app-ci::@marktiderman/genesis-cli is not installed. Add it to devDependencies, or pass doctor: false and features: \"false\".");
            }
            appendFileSync(env.GITHUB_OUTPUT, `features=${features}\nbin=${bin}\n`);
            console.log(`features check: ${features ? "on" : "off"}; genesis: ${bin || "not needed"}`);
            if (missing.length || ((features || env.DOCTOR === "true") && !bin)) process.exit(1);
          JS

      # Each check runs even when an earlier one failed, so one run reports all of them.
      - name: Typecheck
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && inputs.typecheck-script != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.typecheck-script }}
        run: '"$PM" run "$SCRIPT"'

      - name: Lint
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && inputs.lint-script != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.lint-script }}
        run: '"$PM" run "$SCRIPT"'

      - name: Test
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && inputs.test-script != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.test-script }}
        run: '"$PM" run "$SCRIPT"'

      - name: genesis doctor
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && inputs.doctor }}
        working-directory: ${{ inputs.working-directory }}
        env:
          GENESIS: ${{ steps.plan.outputs.bin }}
          STRICT: ${{ inputs.doctor-strict }}
        run: |
          set -euo pipefail
          if [ "$STRICT" = "true" ]; then "$GENESIS" doctor --strict; else "$GENESIS" doctor; fi

      # On a pull request it also checks feature:<id> labels; the labels go through env.
      - name: genesis features check
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.plan.outputs.features == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          GENESIS: ${{ steps.plan.outputs.bin }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: '"$GENESIS" features check --labels "$LABELS"'
