# Makes this folder its own pnpm root, apart from the Genesis workspace above it.
# The doctor reads genesis-ui's type declarations only, so its React peers are not installed.
autoInstallPeers: false
# Genesis's own packages, as `genesis upgrade` writes them (one pattern, not a pin per version,
# which pnpm 11.1.3's frozen install doesn't honour); nothing else is excluded.
minimumReleaseAgeExclude:
  - '@marktiderman/genesis-*'
strictPeerDependencies: false
