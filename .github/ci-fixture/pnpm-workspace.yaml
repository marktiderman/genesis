# Makes this folder its own pnpm root, apart from the Genesis workspace above it.
# The doctor reads genesis-ui's type declarations only, so its React peers are not installed.
autoInstallPeers: false
# Genesis's own packages, as `genesis upgrade` writes them: one entry per package, listing the exact
# versions the lockfile holds. Never a pattern ('@marktiderman/genesis-*'), which would let every
# future Genesis release skip minimumReleaseAge; nothing else is excluded.
minimumReleaseAgeExclude:
  - '@marktiderman/genesis-cli@1.4.0'
  - '@marktiderman/genesis-core@1.6.0 || 1.7.0'
  - '@marktiderman/genesis-design-system@1.4.0'
  - '@marktiderman/genesis-features@0.2.0'
  - '@marktiderman/genesis-studio-server@0.2.1'
  - '@marktiderman/genesis-ui@2.12.1'
strictPeerDependencies: false
